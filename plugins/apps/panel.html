<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>常用应用</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; user-select: none; }
    .panel {
      height: 100%;
      margin: 4px;
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      background: rgba(28, 28, 32, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    .title {
      height: 34px;
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 calc(10px * var(--panel-scale, 1));
      font-size: calc(12.5px * var(--panel-scale, 1));
      color: #d8d8d8;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .title .gear {
      border: none;
      background: transparent;
      color: #a8a8a8;
      cursor: pointer;
      font-size: calc(13px * var(--panel-scale, 1));
      padding: 2px 4px;
      border-radius: 4px;
    }
    .title .gear:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-content: start;
      padding: calc(6px * var(--panel-scale, 1)) calc(8px * var(--panel-scale, 1));
      gap: 2px;
    }
    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      padding: calc(6px * var(--panel-scale, 1)) 2px 4px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #e6e6e6;
      font-family: inherit;
    }
    .app:hover { background: rgba(255, 255, 255, 0.12); }
    .app:active { background: rgba(255, 255, 255, 0.2); }
    .app .icon {
      width: calc(var(--icon-size, 36px) + 8px);
      height: calc(var(--icon-size, 36px) + 8px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      font-size: calc(var(--icon-size, 36px) * 0.42);
      font-weight: 600;
      color: #9ecbff;
    }
    .app .icon img { width: var(--icon-size, 36px); height: var(--icon-size, 36px); object-fit: contain; }
    .app .label {
      width: 100%;
      text-align: center;
      font-size: calc(11px * var(--panel-scale, 1));
      line-height: 1.2;
      max-height: 2.4em;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-all;
    }
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      font-size: calc(12px * var(--panel-scale, 1));
      color: #9a9a9a;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="panel">
    <div class="title">
      <span>常用应用</span>
      <button class="gear" id="gear" title="在软件设置中管理常用应用">⚙ 设置</button>
    </div>
    <div class="grid" id="grid" hidden></div>
    <div class="empty" id="empty">尚未添加应用。<br>点击右上角“设置”，在“插件 → 常用应用”中添加。</div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');

    function applyDisplay(display) {
      const iconSize = Math.round(Number(display && display.iconSize) || 36);
      const scale = Number(display && display.panelScale) || 1;
      document.documentElement.style.setProperty('--icon-size', iconSize + 'px');
      document.documentElement.style.setProperty('--panel-scale', String(scale));
    }

    function render(payload) {
      applyDisplay(payload && payload.display);
      const items = payload && Array.isArray(payload.items) ? payload.items : [];
      if (!items.length) {
        grid.hidden = true;
        empty.hidden = false;
        grid.innerHTML = '';
        return;
      }
      grid.hidden = false;
      empty.hidden = true;
      grid.innerHTML = '';
      items.forEach((item) => {
        const button = document.createElement('button');
        button.className = 'app';
        button.title = item.name + '\n' + item.target;
        const iconBox = document.createElement('span');
        iconBox.className = 'icon';
        if (item.icon) {
          const img = document.createElement('img');
          img.src = item.icon;
          img.draggable = false;
          iconBox.appendChild(img);
        } else {
          iconBox.textContent = String(item.name || '?').slice(0, 1).toUpperCase();
        }
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = item.name;
        button.appendChild(iconBox);
        button.appendChild(label);
        button.addEventListener('click', () => {
          ipcRenderer.invoke('plugin:apps:open', { id: item.id }).then((result) => {
            if (result && result.error) {
              label.textContent = '打开失败';
              setTimeout(() => { label.textContent = item.name; }, 1600);
            }
          });
        });
        grid.appendChild(button);
      });
    }

    document.getElementById('gear').addEventListener('click', () => {
      ipcRenderer.send('plugin:apps:open-settings', null);
    });

    ipcRenderer.on('plugin:apps:changed', (event, payload) => render(payload));
    ipcRenderer.invoke('plugin:apps:list').then(render).catch(() => render(null));
  </script>
</body>

</html>
