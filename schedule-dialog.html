<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课表配置</title>
  <style>
    :root {
      color-scheme: light dark;
      /* 亮色（Win11 设置默认外观） */
      --bg: #f3f3f3;
      --titlebar: #f3f3f3;
      --panel: #ffffff;
      --panel-strong: #ffffff;
      --nav-hover: rgba(0, 0, 0, 0.045);
      --nav-active: rgba(0, 0, 0, 0.055);
      --subnav-active: #eaf3fb;
      --border: #e5e5e5;
      --control-border: #8a8a8a;
      --button-border: #d1d1d1;
      --button-hover: #f5f5f5;
      --button-active: #e6e6e6;
      --text: #1b1b1b;
      --muted: #616161;
      --accent: #0067c0;
      --accent-hover: #1975c5;
      --on-accent: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202020;
        --titlebar: #202020;
        --panel: #2d2d2d;
        --panel-strong: #383838;
        --nav-hover: rgba(255, 255, 255, 0.06);
        --nav-active: rgba(255, 255, 255, 0.08);
        --subnav-active: rgba(76, 194, 255, 0.12);
        --border: #3b3b3b;
        --control-border: #6d6d6d;
        --button-border: #4d4d4d;
        --button-hover: #454545;
        --button-active: #505050;
        --text: #ffffff;
        --muted: #c6c6c6;
        --accent: #4cc2ff;
        --accent-hover: #6ccbff;
        --on-accent: #00223c;
      }
    }

    * { box-sizing: border-box; }

    .window-titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      background: var(--titlebar);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      user-select: none;
    }

    .window-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .window-controls {
      height: 100%;
      display: flex;
      -webkit-app-region: no-drag;
    }

    .window-control {
      width: 46px;
      height: 100%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      box-shadow: none;
      font-size: 0;
    }

    .window-control svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      stroke-width: 1;
      fill: none;
    }

    .window-control:hover { background: var(--nav-hover); }
    .window-control:active { background: var(--nav-active); }
    .window-control.close:hover { background: #c42b1c; color: #ffffff; }
    .window-control.close:active { background: #b02012; color: #ffffff; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      padding-top: 40px;
    }

    .dialog {
      height: calc(100vh - 40px);
      max-height: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      padding: 20px 24px 18px;
    }

    .title {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .button-list {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
      overflow-y: auto;
      padding: 2px;
    }

    .button-list::-webkit-scrollbar {
      width: 12px;
    }

    .button-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .button-list::-webkit-scrollbar-thumb {
      background: var(--nav-active);
      border: 4px solid transparent;
      border-radius: 8px;
      background-clip: content-box;
    }

    .option-btn {
      width: 100%;
      flex-shrink: 0;
      text-align: left;
      min-height: 34px;
      padding: 7px 12px;
      border-radius: 4px;
      border: 1px solid var(--button-border);
      background: var(--panel-strong);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
      box-shadow: none;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .option-btn:hover {
      transform: none;
      border-color: var(--control-border);
      background: var(--button-hover);
    }

    .option-btn:active {
      background: var(--button-active);
    }

    .option-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .option-btn.primary {
      background: var(--subnav-active);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .option-btn.primary:hover {
      background: var(--subnav-active);
      filter: brightness(0.97);
    }

    .toolbar {
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      min-height: 32px;
      padding: 5px 16px;
      border: 1px solid var(--button-border);
      border-radius: 4px;
      background: var(--panel-strong);
      color: var(--text);
      cursor: pointer;
      box-shadow: none;
      transition: background-color 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    }

    button:hover {
      transform: none;
      background: var(--button-hover);
    }

    button:active {
      background: var(--button-active);
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    button.primary {
      background: var(--accent);
      border-color: transparent;
      color: var(--on-accent);
      font-weight: 600;
    }

    button.secondary {
      background: var(--panel-strong);
    }
  </style>
</head>
<body>
  <div class="window-titlebar">
    <span class="window-title" id="windowTitle">课表配置</span>
    <div class="window-controls">
      <button class="window-control" data-window-action="minimize" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg>
      </button>
      <button class="window-control" data-window-action="toggle-maximize" title="还原/最大化" aria-label="还原/最大化">
        <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1" /></svg>
      </button>
      <button class="window-control close" data-window-action="close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
      </button>
    </div>
  </div>

  <div class="dialog">
    <h1 id="dialogTitle" class="title">配置课表</h1>
    <p id="dialogMessage" class="subtitle">请选择操作</p>
    <div id="buttonList" class="button-list"></div>
    <div class="toolbar">
      <button id="cancelBtn" class="secondary" type="button">取消</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const params = new URLSearchParams(window.location.search);
    const payload = JSON.parse(decodeURIComponent(params.get('data') || '{}'));

    const titleEl = document.getElementById('dialogTitle');
    const messageEl = document.getElementById('dialogMessage');
    const listEl = document.getElementById('buttonList');
    const cancelBtn = document.getElementById('cancelBtn');

    titleEl.textContent = payload.title || '配置课表';
    messageEl.textContent = payload.message || '请选择操作';
    document.getElementById('windowTitle').textContent = payload.title || '课表配置';
    document.title = payload.title || '课表配置';

    const buttons = Array.isArray(payload.buttons) ? payload.buttons : [];
    const defaultIndex = Number.isInteger(payload.defaultIndex) ? payload.defaultIndex : 0;

    buttons.forEach((label, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `option-btn ${index === defaultIndex ? 'primary' : ''}`;
      button.textContent = String(label);
      button.addEventListener('click', () => {
        ipcRenderer.send('schedule-dialog-result', index);
        window.close();
      });
      listEl.appendChild(button);
    });

    cancelBtn.addEventListener('click', () => {
      ipcRenderer.send('schedule-dialog-result', null);
      window.close();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        cancelBtn.click();
      }
    });

    document.querySelectorAll('.window-control').forEach((button) => {
      button.addEventListener('click', () => {
        ipcRenderer.send('window-control', button.dataset.windowAction);
      });
    });
  </script>
</body>
</html>
