<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程融合</title>
  <style>
    :root {
      color-scheme: light dark;
      /* 亮色（Win11 设置默认外观） */
      --bg: #f3f3f3;
      --titlebar: #f3f3f3;
      --panel: #ffffff;
      --panel-strong: #ffffff;
      --panel-alt: #fafafa;
      --nav-hover: rgba(0, 0, 0, 0.045);
      --nav-active: rgba(0, 0, 0, 0.055);
      --subnav-active: #eaf3fb;
      --border: #e5e5e5;
      --divider: #ececec;
      --control-border: #8a8a8a;
      --control-border-hover: #000000;
      --button-border: #d1d1d1;
      --button-hover: #f5f5f5;
      --button-active: #e6e6e6;
      --text: #1b1b1b;
      --muted: #616161;
      --accent: #0067c0;
      --accent-hover: #1975c5;
      --on-accent: #ffffff;
      --shadow: rgba(0, 0, 0, 0.045);
      --thumb: #c8c8c8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202020;
        --titlebar: #202020;
        --panel: #2d2d2d;
        --panel-strong: #383838;
        --panel-alt: #333333;
        --nav-hover: rgba(255, 255, 255, 0.06);
        --nav-active: rgba(255, 255, 255, 0.08);
        --subnav-active: rgba(76, 194, 255, 0.12);
        --border: #3b3b3b;
        --divider: #3a3a3a;
        --control-border: #6d6d6d;
        --control-border-hover: #ffffff;
        --button-border: #4d4d4d;
        --button-hover: #454545;
        --button-active: #505050;
        --text: #ffffff;
        --muted: #c6c6c6;
        --accent: #4cc2ff;
        --accent-hover: #6ccbff;
        --on-accent: #00223c;
        --shadow: rgba(0, 0, 0, 0.22);
        --thumb: #555555;
      }
    }

    * { box-sizing: border-box; }

    .titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      background: var(--titlebar);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      user-select: none;
    }

    .titlebar strong {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.2px;
    }

    .controls {
      height: 100%;
      display: flex;
      -webkit-app-region: no-drag;
    }

    .controls button {
      width: 46px;
      height: 100%;
      min-height: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 0;
      color: var(--text);
      background: transparent;
      box-shadow: none;
      font-size: 0;
      cursor: default;
    }

    .controls button svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      stroke-width: 1;
      fill: none;
    }

    .controls button:hover { background: var(--nav-hover); }
    .controls button:active { background: var(--nav-active); }
    .controls .close:hover { background: #c42b1c; color: #ffffff; }
    .controls .close:active { background: #b02012; color: #ffffff; }

    body {
      margin: 0;
      padding-top: 40px;
      color: var(--text);
      background: var(--bg);
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }

    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--thumb);
      border: 4px solid transparent;
      border-radius: 8px;
      background-clip: content-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-clip: content-box;
      border: 3px solid transparent;
    }

    main { max-width: 700px; margin: 0 auto; padding: 18px 24px 32px; }
    .intro { color: var(--muted); line-height: 1.6; margin: 0 0 16px; font-size: 14px; }
    .panel { padding: 18px 20px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); box-shadow: 0 1px 2px var(--shadow); }
    label { display: block; color: var(--muted); font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    select, button { font-family: inherit; }
    select {
      width: 100%;
      min-height: 34px;
      padding: 6px 11px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--control-border);
      border-radius: 4px;
      font-size: 14px;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }
    select:hover { border-color: var(--control-border-hover); }
    select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .lessons { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 16px; }
    .lesson {
      min-height: 58px;
      padding: 8px 12px;
      text-align: left;
      color: var(--text);
      background: var(--panel-strong);
      border: 1px solid var(--button-border);
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
      box-shadow: none;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }
    .lesson:hover { border-color: var(--control-border); background: var(--button-hover); }
    .lesson:active { background: var(--button-active); }
    .lesson.selected { border-color: var(--accent); background: var(--subnav-active); color: var(--accent); font-weight: 600; }
    .lesson small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; margin-bottom: 5px; }
    .choices { display: none; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--divider); }
    .choices.visible { display: block; }
    .target-list { display: flex; gap: 8px; flex-wrap: wrap; }
    .target {
      flex: 1 1 180px;
      min-height: 32px;
      padding: 6px 12px;
      color: var(--text);
      text-align: left;
      background: var(--panel-strong);
      border: 1px solid var(--button-border);
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
      box-shadow: none;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }
    .target:hover { border-color: var(--control-border); background: var(--button-hover); }
    .target.selected { border-color: var(--accent); background: var(--subnav-active); color: var(--accent); font-weight: 600; }
    .target input { margin-right: 7px; accent-color: var(--accent); }
    .option { display: flex; align-items: center; gap: 8px; margin-top: 16px; color: var(--text); font-weight: 400; font-size: 14px; cursor: pointer; }
    .option input { width: 16px; height: 16px; accent-color: var(--accent); }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .actions button {
      min-height: 32px;
      padding: 5px 16px;
      border: 1px solid var(--button-border);
      border-radius: 4px;
      color: var(--text);
      background: var(--panel-strong);
      font-size: 14px;
      cursor: pointer;
      box-shadow: none;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }
    .actions button:hover { border-color: var(--button-border); background: var(--button-hover); }
    .actions button:active { background: var(--button-active); }
    .actions .primary { color: var(--on-accent); background: var(--accent); border-color: transparent; font-weight: 600; }
    .actions .primary:hover { background: var(--accent-hover); }
    .actions .primary:active { filter: brightness(0.92); }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { min-height: 20px; margin-top: 12px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header class="titlebar"><strong>课程融合</strong><div class="controls"><button data-window-action="minimize" title="最小化" aria-label="最小化"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg></button><button data-window-action="toggle-maximize" title="还原/最大化" aria-label="还原/最大化"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1" /></svg></button><button class="close" data-window-action="close" title="关闭" aria-label="关闭"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg></button></div></header>
  <main>
    <p class="intro">选择同一日程中的两节课，融合区间内的课程会显示为一节。此操作仅在本次运行中生效，重启后自动恢复。</p>
    <section class="panel">
      <label for="daySelect">选择日程</label>
      <select id="daySelect"></select>
      <div id="lessons" class="lessons"></div>
      <div id="choices" class="choices">
        <label>融合成哪一节课</label>
        <div id="targetList" class="target-list"></div>
        <label class="option"><input id="ignoreBreak" type="checkbox">忽略融合区间内的下课时间</label>
      </div>
      <div id="status"></div>
      <div class="actions"><button id="resetBtn" type="button">恢复原课表</button><button id="applyBtn" class="primary" type="button" disabled>应用融合</button></div>
    </section>
  </main>
  <script>
    const { ipcRenderer } = require('electron');
    let config = null;
    let selected = [];
    let target = null;
    const daySelect = document.getElementById('daySelect');
    const lessons = document.getElementById('lessons');
    const choices = document.getElementById('choices');
    const targetList = document.getElementById('targetList');
    const applyBtn = document.getElementById('applyBtn');
    const status = document.getElementById('status');
    const subjectName = (value) => config?.subject_name?.[value] || value || '未知课程';
    const displayValue = (value) => Array.isArray(value) ? value.map(subjectName).join(' / ') : subjectName(value);
    function currentDay() { return config.daily_class[Number(daySelect.value)] || { classList: [] }; }
    function renderLessons() {
      selected = []; target = null; choices.classList.remove('visible'); applyBtn.disabled = true;
      lessons.innerHTML = '';
      currentDay().classList.forEach((value, index) => {
        const button = document.createElement('button'); button.type = 'button'; button.className = 'lesson';
        button.innerHTML = `<small>第 ${index + 1} 节</small>${displayValue(value)}`;
        button.addEventListener('click', () => selectLesson(index)); lessons.appendChild(button);
      });
      status.textContent = '请选择两节课作为融合范围。';
    }
    function selectLesson(index) {
      if (selected.length === 2 && !selected.includes(index)) selected = [];
      if (selected.includes(index)) selected = selected.filter(item => item !== index); else selected.push(index);
      document.querySelectorAll('.lesson').forEach((button, item) => button.classList.toggle('selected', selected.includes(item)));
      if (selected.length !== 2) { choices.classList.remove('visible'); applyBtn.disabled = true; status.textContent = '请选择两节课作为融合范围。'; return; }
      selected.sort((a, b) => a - b); target = selected[0]; choices.classList.add('visible'); renderTargets(); status.textContent = `已选择第 ${selected[0] + 1} 节至第 ${selected[1] + 1} 节。`;
    }
    function renderTargets() {
      targetList.innerHTML = '';
      selected.forEach(index => {
        const button = document.createElement('button'); button.type = 'button'; button.className = `target${target === index ? ' selected' : ''}`;
        button.innerHTML = `<input type="radio" ${target === index ? 'checked' : ''}>第 ${index + 1} 节：${displayValue(currentDay().classList[index])}`;
        button.addEventListener('click', () => { target = index; renderTargets(); applyBtn.disabled = false; }); targetList.appendChild(button);
      });
      applyBtn.disabled = target === null;
    }
    async function load() {
      try {
        config = await ipcRenderer.invoke('read-config-file');
        (config.daily_class || []).forEach((day, index) => { const option = document.createElement('option'); option.value = index; option.textContent = `${day.Chinese || `日程 ${index + 1}`} (${day.classList?.length || 0} 节)`; daySelect.appendChild(option); });
        if (!config.daily_class?.length) { status.textContent = '配置中没有可用课程。'; return; }
        renderLessons();
      } catch (error) { status.textContent = '读取课程配置失败。'; }
    }
    daySelect.addEventListener('change', renderLessons);
    applyBtn.addEventListener('click', () => { const [start, end] = selected; ipcRenderer.send('course-fusion-result', { dayIndex: Number(daySelect.value), start, end, target, ignoreBreak: document.getElementById('ignoreBreak').checked }); status.textContent = '融合已应用到当前课表。'; });
    document.getElementById('resetBtn').addEventListener('click', () => { ipcRenderer.send('course-fusion-result', null); status.textContent = '已恢复原课表。'; });
    document.querySelectorAll('[data-window-action]').forEach(button => button.addEventListener('click', () => ipcRenderer.send('window-control', button.dataset.windowAction)));
    load();
  </script>
</body>
</html>
