<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>提醒光效</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    /* 全屏提醒 = 普通课表条遮罩之外，额外叠加的一层渐隐光效。
       窗口本身点击穿透（主进程 setIgnoreMouseEvents），不承载文字、不阻挡操作。
       光效固定播放 1 秒，与提醒时长无关：
       前 0.3 秒从提醒发出位置向全屏扩散并渐显，后 0.7 秒渐隐消失。 */
    #fsGlow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      /* 光效扩散原点（主进程换算后的屏幕 DIP 坐标），默认顶部中央 */
      --origin-x: 50%;
      --origin-y: 8%;
    }
    /* 以原点为中心的圆形光浪，尺寸足以铺满屏幕最远角 */
    #fsGlow .glow-wave {
      position: absolute;
      left: var(--origin-x);
      top: var(--origin-y);
      width: 180vmax;
      height: 180vmax;
      border-radius: 50%;
      background: radial-gradient(
        circle at 50% 50%,
        var(--reminder-glow-color, rgba(0, 200, 0, 0.85)) 0%,
        var(--reminder-glow-color, rgba(0, 200, 0, 0.85)) 18%,
        transparent 62%
      );
      mix-blend-mode: screen;
      opacity: 0;
      will-change: transform, opacity;
    }
    /* 0%→30%（0.3s）：从小圆扩散到全屏并渐显到最亮；
       30%→100%（0.7s）：保持全屏、渐隐到 0 */
    #fsGlow.active .glow-wave {
      animation: glow-spread 1s ease-out forwards;
    }
    @keyframes glow-spread {
      0% {
        transform: translate(-50%, -50%) scale(0.02);
        opacity: 0;
      }
      30% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.8;
        /* 后 0.7 秒匀速渐隐到 0 */
        animation-timing-function: linear;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.06);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div id="fsGlow">
    <div class="glow-wave"></div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const glow = document.getElementById('fsGlow');
    const wave = glow.querySelector('.glow-wave');
    let finished = true;

    function show(data) {
      data = data || {};
      const color = String(data.color || '').trim();
      if (color) glow.style.setProperty('--reminder-glow-color', color);
      else glow.style.removeProperty('--reminder-glow-color');
      // 扩散原点（由主进程换算为光效窗内 DIP 坐标）
      if (Number.isFinite(Number(data.originX)) && Number.isFinite(Number(data.originY))) {
        glow.style.setProperty('--origin-x', `${Math.round(Number(data.originX))}px`);
        glow.style.setProperty('--origin-y', `${Math.round(Number(data.originY))}px`);
      }
      // 取消可能存在的提前淡出动画并重启 1 秒扩散
      wave.getAnimations().forEach((a) => a.cancel());
      glow.classList.remove('active', 'closing');
      void glow.offsetWidth;
      glow.classList.add('active');
      finished = false;
    }

    // 遮罩被提前关闭时：从当前状态快速淡出（不打断已扩散开的形态）
    function fadeOut() {
      if (finished || glow.classList.contains('closing')) return;
      glow.classList.add('closing');
      const cs = getComputedStyle(wave);
      wave.animate(
        {
          opacity: [cs.opacity || 0, 0],
          transform: [cs.transform || 'translate(-50%,-50%) scale(1)', cs.transform || 'translate(-50%,-50%) scale(1)']
        },
        { duration: 250, easing: 'ease-out', fill: 'forwards' }
      );
    }

    wave.addEventListener('animationend', (e) => {
      if (e.animationName === 'glow-spread') finished = true;
    });

    ipcRenderer.on('reminder-data', (e, data) => show(data));
    ipcRenderer.on('reminder-glow-hide', fadeOut);
  </script>
</body>
</html>
