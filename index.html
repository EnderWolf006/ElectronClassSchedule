<!DOCTYPE html>
<html lang="ch" id="html">

<head>
  <title>电子课表</title>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="text/javascript" src="js/jquery.min.js"></script>
  <script type="text/javascript" src="js/index.js"></script>
  <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>
  <div class="globalContainer" id="globalContainer">
    <div id="componentRows" class="componentRows">
      <div class="componentRow" data-component-row="0">
        <div class="scheduleComponent" data-component-slot="schedule">
          <div class="classContainer background" id="classContainer">
            <div class="class">加</div>
            <div class="class">载</div>
            <div class="class">中</div>
          </div>
          <div class="countdownContainer" id="countdownContainer">
            <div class="triangle"></div>
            <div class="countdowner" id="countdowner">
              <div class="currentClass" id="currentFullName">Loading</div>
              <div class="countdown" id="countdownText">00:00</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="miniCountdown" id="miniCountdown">00:00</div>
  <div class="reminderMask notIgnoreClick" id="reminderMask">
    <div class="reminderText" id="reminderText"></div>
  </div>

</body>
<script>
  const { ipcRenderer } = require('electron');
  let scheduleData = {
    scheduleArray: [],
    currentHighlight: { index: null, type: null, fullName: 'Loading', countdown: null, countdownText: '00:00' },
    timetable: null,
    divider: []
  };
  let globalContainer = document.getElementById('globalContainer')
  let classContainer = document.getElementById('classContainer')
  let countdownContainer = document.getElementById('countdownContainer')
  let countdowner = document.getElementById('countdowner')
  let currentFullName = document.getElementById('currentFullName')
  let countdownText = document.getElementById('countdownText')
  let inlineCountdown = document.querySelector('.inlineCountdown')
  let weekEN = document.getElementById('weekEN')
  let weekCH = document.getElementById('weekCH')
  let countdownDays = document.getElementById('countdownDays')
  let currentTime = document.getElementById('currentTime')
  let miniCountdown = document.getElementById('miniCountdown')
  let rightSidebar = document.getElementById('rightSidebar')
  let leftSidebar = document.getElementById('leftSidebar')
  let root = document.querySelector(':root');
  let componentRows = document.getElementById('componentRows')
  let isClassCountdown = true
  let isClassHidden = false
  // 从 localStorage 恢复：设置变更触发 reload 后首帧即为正确状态，
  // 不必等主进程重新下发 IPC，避免“次日课表”闪断
  let showNextDayAfterSchool = localStorage.getItem('showNextDayAfterSchool') === '1'
  let lastScheduleData = {
    currentHighlight: {
      index: null,
      type: null,
      fullName: null,
      countdown: null,
      countdownText: null
    },
    scheduleArray: [null, null, null],
    timetable: null,
    divider: [null, null]
  }

  function getComponentLayout() {
    const configured = Array.isArray(settings.component_layout) ? settings.component_layout : [['schedule', 'week', 'countdown']];
    let legacyIndex = 0;
    const rows = configured.map(row => Array.isArray(row) ? row.map(component => {
      if (typeof component === 'string') return { id: `${component}-${++legacyIndex}`, type: component, options: {} };
      return component && ['schedule', 'week', 'date', 'countdown', 'time', 'customText'].includes(component.type)
        ? { id: component.id || `${component.type}-${++legacyIndex}`, type: component.type, options: component.options || {} } : null;
    }).filter(Boolean) : []).filter(row => row.length);
    return rows.length ? rows : [[{ id: 'schedule-1', type: 'schedule', options: {} }]];
  }

  function renderComponentLayout() {
    const layout = getComponentLayout();
    componentRows.innerHTML = layout.map((row, rowIndex) => `
      <div class="componentRow" data-component-row="${rowIndex}">
        ${row.map(component => {
          if (component.type === 'schedule') return `
            <div class="scheduleComponent" data-component-slot="schedule" data-component-id="${component.id}">
              <div class="classContainer background" id="classContainer">
                <div class="class">加</div><div class="class">载</div><div class="class">中</div>
              </div>
              <div class="countdownContainer" id="countdownContainer">
                <div class="triangle"></div>
                <div class="countdowner" id="countdowner">
                  <div class="currentClass" id="currentFullName">Loading</div>
                  <div class="countdown" id="countdownText">00:00</div>
                </div>
              </div>
            </div>`;
          if (component.type === 'week') return `<div class="leftSidebar sidebar background" data-component-slot="week" data-component-id="${component.id}"><span class="weekEN t">Load</span><div class="corner options notIgnoreClick weekCH">ing</div></div>`;
          if (component.type === 'date') return `<div class="leftSidebar sidebar background" data-component-slot="date" data-component-id="${component.id}"><span class="dateValue t">00/00</span><div class="corner options notIgnoreClick dateWeek">周一</div></div>`;
          if (component.type === 'time') return `<div class="timeSidebar sidebar background" data-component-slot="time" data-component-id="${component.id}"><span class="currentTime t">00:00:00</span></div>`;
          if (component.type === 'customText') return `<div class="customText background" data-component-slot="customText" data-component-id="${component.id}"></div>`;
          return `<div class="rightSidebar sidebar background" data-component-slot="countdown" data-component-id="${component.id}"><span class="countdownDays t">000</span><div class="corner">天</div></div>`;
        }).join('')}
      </div>
    `).join('');
    classContainer = document.getElementById('classContainer');
    countdownContainer = document.getElementById('countdownContainer');
    currentFullName = document.getElementById('currentFullName');
    countdownText = document.getElementById('countdownText');
    inlineCountdown = document.querySelector('.inlineCountdown');
    weekEN = document.querySelector('.weekEN');
    weekCH = document.querySelector('.weekCH');
    countdownDays = document.querySelector('.countdownDays');
    currentTime = document.querySelector('.currentTime');
    document.querySelectorAll('[data-component-slot="customText"]').forEach((el) => {
      const match = layout.flat().find((component) => component.id === el.dataset.componentId);
      if (match) el.textContent = match.options.text ?? '';
    });
    rightSidebar = document.querySelector('[data-component-slot="countdown"]');
    leftSidebar = document.querySelector('[data-component-slot="week"]');
  }

  function setScheduleClass() {
    let classHtml = '';
    const fusion = scheduleData.fusion;
    const highlightedIndex = scheduleData.currentHighlight.displayIndex ?? scheduleData.currentHighlight.index;
    const showInlineCountdown = hasComponentBelowSchedule() && isClassCountdown;
    if (scheduleData.currentHighlight.isNextDay) {
      classHtml += '<div class="class breakClassExpanded stateTransition">明天</div>';
    }
    for (let i = 0; i < scheduleData.scheduleArray.length; i++) {
      const isBreakPosition = showInlineCountdown && scheduleData.currentHighlight.isBreak && scheduleData.currentHighlight.index === i && i < scheduleData.scheduleArray.length;
      const isFusionStart = fusion && i === fusion.start;
      const isInsideFusion = fusion && i >= fusion.start && i <= fusion.end;
      if (isBreakPosition) {
        classHtml += `<div class="class breakClassExpanded stateTransition" id="highlighted"><span class="expandedClassName"></span><span class="inlineCountdown">${scheduleData.currentHighlight.countdownText}</span></div>`;
      }
      if (!isBreakPosition && scheduleData.divider.indexOf(i) != -1)
        classHtml += '<div class="divider"></div>'
      if (isInsideFusion && !isFusionStart) continue;
      let inner = scheduleData.scheduleArray[i]
      if (isFusionStart && fusion.subject) inner = fusion.subject;
      if (inner === undefined || inner === null) inner = ''
      inner = String(inner)
      if (inner.indexOf('@') != -1) {
        inner = `<div><div style="display:inline">${inner.split('@')[0]}</div><div class="subClass">${inner.split('@')[1]}</div></div>`
      }
      if (highlightedIndex == i && scheduleData.currentHighlight.isBreak && !showInlineCountdown) {
        classHtml += `<div class="class upcoming" id="highlighted">${inner}</div>`
      }
      else if (highlightedIndex == i && !scheduleData.currentHighlight.isBreak) {
        if (scheduleData.currentHighlight.type === 'current') {
          if (showInlineCountdown)
            classHtml += `<div class="class current currentClassExpanded stateTransition" id="highlighted"><span class="expandedClassName"></span><span class="inlineCountdown">${scheduleData.currentHighlight.countdownText}</span></div>`
          else
            classHtml += `<div class="class current" id="highlighted">${inner}</div>`
        }
        else if (scheduleData.currentHighlight.isEnd)
          classHtml += `<div class="class ended" id="highlighted">${inner}</div>`
        else if (scheduleData.currentHighlight.type === 'upcoming')
          classHtml += `<div class="class upcoming" id="highlighted">${inner}</div>`
      }
      else {
        if (scheduleData.currentHighlight.index > i)
          classHtml += `<div class="class" style="color:rgba(188,188,188);">${inner}</div>`
        else
          classHtml += `<div class="class">${inner}</div>`
      }
    }
    if (showInlineCountdown && scheduleData.currentHighlight.isBreak && scheduleData.currentHighlight.index === scheduleData.scheduleArray.length) {
      classHtml += `<div class="class breakClassExpanded stateTransition" id="highlighted"><span class="expandedClassName"></span><span class="inlineCountdown">${scheduleData.currentHighlight.countdownText}</span></div>`;
    }
    document.querySelectorAll('.scheduleComponent .classContainer').forEach((element) => {
      element.innerHTML = classHtml;
      const expandedClassName = element.querySelector('.expandedClassName');
      if (expandedClassName) expandedClassName.textContent = scheduleData.currentHighlight.fullName || '';
    });
    classContainer = document.querySelector('.scheduleComponent .classContainer');
    inlineCountdown = classContainer?.querySelector('.inlineCountdown');
  }

  function setBackgroundDisplay() {
    let elements = document.getElementsByClassName('background')
    for (element of elements) {
      element.style.visibility = (scheduleData.currentHighlight.type === 'current' && isClassHidden) ? 'hidden' : 'visible'
    }
  }

  function hasComponentBelowSchedule() {
    const scheduleComponent = document.querySelector('.scheduleComponent');
    const scheduleRow = scheduleComponent?.closest('.componentRow');
    if (!scheduleRow) return false;
    let row = scheduleRow.nextElementSibling;
    while (row) {
      if (row.querySelector('[data-component-slot]')) return true;
      row = row.nextElementSibling;
    }
    return false;
  }

  function setCountdownerContent() {
    if (!currentFullName || !countdownText || !countdownContainer || !miniCountdown) return;
    if (scheduleData.currentHighlight.isNextDay) {
      countdownContainer.style.display = 'none';
      miniCountdown.style.display = 'none';
      document.querySelectorAll('.scheduleComponent .countdownContainer').forEach((element) => {
        element.style.display = 'none';
      });
      return;
    }
    currentFullName.innerText = scheduleData.currentHighlight.fullName;
    // 使用 CSS 变量，使浅色模式下自动应用深绿/深黄（与课表组件一致），深色模式保持亮绿/亮黄
    currentFullName.style.color = scheduleData.currentHighlight.type === 'current' ? 'var(--col-current)' : 'var(--col-break)'
    countdownText.innerText = scheduleData.currentHighlight.countdownText;
    if (inlineCountdown) {
      inlineCountdown.innerText = scheduleData.currentHighlight.countdownText;
      inlineCountdown.style.display = isClassCountdown ? 'inline' : 'none';
    }
    if (scheduleData.currentHighlight.type === 'current') {
      if (isClassCountdown) {
        if (hasComponentBelowSchedule()) {
          countdownContainer.style.display = 'none';
          miniCountdown.style.display = 'none';
        } else if (isClassHidden) { // 无下方组件且上课隐藏 -> 显示顶部小窗口
          countdownContainer.style.display = 'none'
          miniCountdown.style.display = 'block'
          miniCountdown.innerHTML = `<div class="currentClass">${currentFullName.innerText = scheduleData.currentHighlight.fullName}</div><div class="countdown" style="margin-left:5px">${scheduleData.currentHighlight.countdownText}</div>`
        } else {
          countdownContainer.style.display = 'block';
          miniCountdown.style.display = 'none';
        }
      } else { // 上课 并且关闭了倒计时 -> 都不显示
        countdownContainer.style.display = 'none'
        miniCountdown.style.display = 'none'
      }
    }
    else if (scheduleData.currentHighlight.isBreak) {
      if (isClassCountdown && !hasComponentBelowSchedule()) {
        countdownContainer.style.display = 'block';
      } else {
        countdownContainer.style.display = 'none';
      }
      miniCountdown.style.display = 'none';
    }
    else { // 下课正常显示
      countdownContainer.style.display = 'block';
      miniCountdown.style.display = 'none'
    }
    document.querySelectorAll('.scheduleComponent .countdowner').forEach((element) => {
      const name = element.querySelector('.currentClass');
      const countdown = element.querySelector('.countdown');
      if (name) {
        name.innerText = scheduleData.currentHighlight.fullName;
        name.style.color = currentFullName.style.color;
      }
      if (countdown) countdown.innerText = scheduleData.currentHighlight.countdownText;
    });
    document.querySelectorAll('.scheduleComponent .countdownContainer').forEach((element) => {
      element.style.display = countdownContainer.style.display;
    });
  }

  function setCountdownerPosition() {
    if (!countdownContainer || !classContainer) return;
    let highlightElement = document.getElementById('highlighted')
    if (!highlightElement) return;
    let offset = {}
    if (scheduleData.currentHighlight.type === 'current') {
      offset = {
        x: highlightElement.offsetLeft - countdownContainer.offsetWidth / 2 + highlightElement.offsetWidth / 2,
        y: classContainer.offsetHeight
      }
    } else if (scheduleData.currentHighlight.type === 'upcoming') {
      if (scheduleData.currentHighlight.index != 0 && scheduleData.divider.indexOf(scheduleData.currentHighlight.index) != -1) {
        offset = {
          x: highlightElement.offsetLeft - countdownContainer.offsetWidth / 2 - Number(getComputedStyle(highlightElement).marginLeft.replace('px', '')) - getComputedStyle(root).getPropertyValue('--divider-width').replace('px', '') / 2 - getComputedStyle(root).getPropertyValue('--divider-margin').replace('px', ''),
          y: classContainer.offsetHeight
        }
      } else {
        offset = {
          x: highlightElement.offsetLeft - countdownContainer.offsetWidth / 2 - Number(getComputedStyle(highlightElement).marginLeft.replace('px', '')),
          y: classContainer.offsetHeight
        }
      }
    }
    if (scheduleData.currentHighlight.isEnd) {
      offset = {
        x: highlightElement.offsetLeft - countdownContainer.offsetWidth / 2 + highlightElement.offsetWidth + Number(getComputedStyle(highlightElement).marginLeft.replace('px', '')),
        y: classContainer.offsetHeight
      }
    }
    countdownContainer.style.left = offset.x + 'px'
    countdownContainer.style.top = offset.y + 'px'
  }

  function setSidebar() {
    const editedDate = getCurrentEditedDate()
    const instances = getComponentLayout().flat();
    const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
    const month = String(editedDate.getMonth() + 1).padStart(2, '0');
    const day = String(editedDate.getDate()).padStart(2, '0');
    instances.filter((component) => component.type === 'date').forEach((component) => {
      const element = document.querySelector(`[data-component-id="${component.id}"]`);
      if (!element) return;
      element.querySelector('.dateValue').innerText = `${month}/${day}`;
      element.querySelector('.dateWeek').innerText = `周${dayNames[editedDate.getDay()]}`;
    });
    let data = getCurrentDayScheduleConfig()
    if (!data) return
    instances.filter((component) => component.type === 'week').forEach((component) => {
      const element = document.querySelector(`[data-component-id="${component.id}"]`);
      if (!element) return;
      element.querySelector('.weekCH').innerText = data.Chinese;
      element.querySelector('.weekEN').innerText = data.English;
      element.style.display = component.options.display === false ? 'none' : '';
    });
    instances.filter((component) => component.type === 'time').forEach((component) => {
      const element = document.querySelector(`[data-component-id="${component.id}"] .currentTime`);
      if (element) element.innerText = (component.options.source === 'system' ? new Date() : editedDate).toLocaleTimeString('zh-CN', { hour12: false });
    });
    instances.filter((component) => component.type === 'customText').forEach((component) => {
      const element = document.querySelector(`[data-component-id="${component.id}"]`);
      if (element) element.textContent = component.options.text ?? '';
    });
    instances.filter((component) => component.type === 'countdown').forEach((component) => {
      const element = document.querySelector(`[data-component-id="${component.id}"]`);
      if (!element) return;
      const target = component.options.target || scheduleConfig.countdown_target;
      element.style.display = target === 'hidden' ? 'none' : '';
      const value = target && target !== 'hidden' ? Math.ceil(Math.abs(new Date(target) - editedDate) / (1000 * 60 * 60 * 24)) : 0;
      const days = element.querySelector('.countdownDays');
      if (days) {
        days.innerText = value;
        days.style.color = component.options.color || '';
      }
    });
  }

  function tick(reset = false) {
    scheduleData = getScheduleData();
    setCountdownerContent()
    setSidebar()
    if (JSON.stringify(scheduleData.scheduleArray) != JSON.stringify(lastScheduleData.scheduleArray) ||
      scheduleData.currentHighlight.index != lastScheduleData.currentHighlight.index ||
      scheduleData.currentHighlight.fullName != lastScheduleData.currentHighlight.fullName ||
      scheduleData.currentHighlight.type != lastScheduleData.currentHighlight.type ||
      scheduleData.currentHighlight.isNextDay != lastScheduleData.currentHighlight.isNextDay || reset) {
      setScheduleClass()
      setCountdownerPosition()
      setBackgroundDisplay()
    }
    lastScheduleData = $.extend(true, {}, scheduleData)
    checkReminders(scheduleData)
  }


  function applyScheduleCss() {
    if (!root) return;
    for (const key in settings.css_style) {
      root.style.setProperty(key, settings.css_style[key])
    }
  }

  // ===== 主题切换 =====
  let themeMediaQuery = null;
  function applyTheme() {
    const mode = settings?.theme_mode || 'auto';
    let actual = mode;
    if (mode === 'auto') {
      actual = (window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', actual);
    // auto 模式下监听系统变化
    if (mode === 'auto' && !themeMediaQuery) {
      themeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
      themeMediaQuery.addEventListener('change', () => { if (settings?.theme_mode === 'auto') applyTheme(); });
    }
  }

  let lastTickTime = new Date().getTime()
  loadScheduleConfig().then(() => {
    renderComponentLayout()
    applyScheduleCss()
    applyTheme()
    scheduleData = getScheduleData();
    tick(true)
  }).catch(() => {
    applyScheduleCss()
    applyTheme()
    tick(true)
  })
  setInterval(() => {
    if (new Date().getTime() - lastTickTime >= 1000) {
      lastTickTime = new Date().getTime()
      tick()
      reportWindowHeight()
    }
  }, 20);

  // ===== 行级淡化 =====
  // 淡化由主进程光标轮询（cursor-position）驱动：forward 穿透模式下
  // 转发的 mousemove 事件有概率长时间收不到（尤其刚启动时），不能依赖。
  // 主进程每 100ms 上报光标相对窗口的位置，这里用 elementFromPoint
  // 定位所在行并只淡化该行；指向空白处/可交互元素/移出窗口时立即恢复。
  const restoreRows = () => {
    componentRows.querySelectorAll('.componentRow.faded').forEach((el) => el.classList.remove('faded'))
  }
  ipcRenderer.on('cursor-position', (e, pos) => {
    if (!pos || !pos.inside) { restoreRows(); return }
    let row = null
    const el = document.elementFromPoint(pos.x, pos.y)
    if (el && el.closest) row = el.closest('.componentRow')
    // elementFromPoint 可能因光标落在子元素间隙（margin/gap）而找不到行，
    // 此时遍历行 bounding rect 手动命中，避免滑动过程中误恢复
    if (!row) {
      const rows = componentRows.querySelectorAll('.componentRow')
      for (const r of rows) {
        const rect = r.getBoundingClientRect()
        if (pos.x >= rect.left && pos.x <= rect.right && pos.y >= rect.top && pos.y <= rect.bottom) {
          row = r
          break
        }
      }
    }
    const className = el && typeof el.className === 'string' ? el.className : ''
    if (row && className.indexOf('notIgnoreClick') === -1) {
      componentRows.querySelectorAll('.componentRow.faded').forEach((f) => {
        if (f !== row) f.classList.remove('faded')
      })
      row.classList.add('faded')
    } else {
      restoreRows()
    }
  })
  // 穿透被临时关闭（悬停在可交互元素上）时窗口能收到真实事件，补一条保险
  document.addEventListener('mouseleave', restoreRows)
  // mousemove 仅用于可交互元素的点击穿透切换
  window.addEventListener("mousemove", event => {
    const className = typeof event.target.className === 'string' ? event.target.className : ''
    ipcRenderer.send('setIgnore', className.indexOf('notIgnoreClick') === -1)
  });
  ipcRenderer.send('setIgnore', true)

  // ===== 窗口高度自适应 =====
  // 内容高度 = 组件行区域与课程下方倒计时框（绝对定位、不计入行高）
  // 以及迷你倒计时中视口底部的最大值；行数/字号/布局变化都会触发重测，
  // 避免行数较多时窗口仍是固定 200px 导致内容被裁掉。
  let lastReportedHeight = 0
  function reportWindowHeight() {
    if (!componentRows) return
    let bottom = componentRows.getBoundingClientRect().bottom
    document.querySelectorAll('.countdownContainer').forEach((el) => {
      const rect = el.getBoundingClientRect()
      if (rect.height > 0 && rect.bottom > bottom) bottom = rect.bottom
    })
    if (miniCountdown && getComputedStyle(miniCountdown).display !== 'none') {
      const rect = miniCountdown.getBoundingClientRect()
      if (rect.bottom > bottom) bottom = rect.bottom
    }
    const height = Math.ceil(bottom + 2)
    if (height > 20 && height !== lastReportedHeight) {
      lastReportedHeight = height
      ipcRenderer.send('main-window-height', height)
    }
  }
  new ResizeObserver(() => reportWindowHeight()).observe(componentRows)

  function setScheduleDialog() {
    ipcRenderer.send('dialog', {
      reply: 'getSelectedClassIndex',
      options: {
        title: '更改课表',
        message: `请选择你要更改的课程序号`,
        buttons: scheduleData.scheduleArray.map((value, index) => { return `第 ${index + 1} 节: ${scheduleConfig.subject_name[value]}` }),
        cancelId: -1,
        defaultId: scheduleData.currentHighlight.index
      }
    })
  }

  ipcRenderer.on('getSelectedClassIndex', (e, arg) => {
    if (arg.index == -1) return
    let text = arg.arg.options.buttons[arg.index]
    let classes = Object.keys(scheduleConfig.subject_name).sort();
    ipcRenderer.send('dialog', {
      reply: 'getSelectedChangingClass',
      index: arg.index,
      classes: classes,
      options: {
        title: '更改课表',
        message: `将 第 ${arg.index + 1} 节 ${scheduleConfig.subject_name[scheduleData.scheduleArray[arg.index]]} 更改为:`,
        buttons: classes.map((value) => { return scheduleConfig.subject_name[value] }),
        cancelId: -1,
      }
    })
  })

  ipcRenderer.on('getSelectedChangingClass', (e, arg) => {
    if (arg.index == -1) return
    let index = arg.arg.index;
    let selectedClass = arg.arg.classes[arg.index];
    const date = getCurrentEditedDate();
    const dayConfig = getCurrentDayScheduleConfig();
    if (dayConfig && Array.isArray(dayConfig.classList)) {
      dayConfig.classList[index] = selectedClass;
    }
  })

  ipcRenderer.on('openSettingDialog', (e, arg) => {
    setScheduleDialog()
  })

  document.addEventListener("click", function (event) {
    if (event.target.className.indexOf('options') != -1) {
      ipcRenderer.send('pop')
    }
  });

  ipcRenderer.on('setTimeOffset', (e, arg) => {
    timeOffset = arg
    localStorage.setItem('timeOffset', arg.toString())
  })

  ipcRenderer.on('ClassCountdown', (e, arg) => {
    isClassCountdown = arg
    tick(reset = true)
  })

  ipcRenderer.on('ClassHidden', (e, arg) => {
    isClassHidden = arg
    tick(reset = true)
  })

  ipcRenderer.on('NextDayAfterSchool', (e, arg) => {
    showNextDayAfterSchool = arg === true || arg === 'true' || arg === 1
    localStorage.setItem('showNextDayAfterSchool', showNextDayAfterSchool ? '1' : '0')
    tick(true)
  })

  // 主进程每秒心跳：窗口被遮挡、屏幕关闭甚至系统休眠期间，
  // 渲染进程自己的 setInterval 可能被 Chromium 节流/挂起，
  // 主进程 IPC 仍会立即派发，保证放学后能准时切到次日课表。
  ipcRenderer.on('app-heartbeat', () => {
    tick()
  })

  // 从遮挡/最小化/锁屏/休眠恢复到可见状态时立即强制刷新一次，
  // 不用等待下一个周期
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) tick(true)
  })

  ipcRenderer.on('courseFusion', (e, fusion) => {
    setCourseFusion(fusion);
    tick(true);
  })

  ipcRenderer.on('theme-mode-changed', (e, mode) => {
    // 软件设置中选择深/浅色时立即预览：直接更新内存中的模式并刷新外观（此时文件可能尚未保存）
    if (mode === 'dark' || mode === 'light' || mode === 'auto') {
      settings.theme_mode = mode;
    }
    applyTheme()
  })

  ipcRenderer.on('settings-reloaded', () => {
    applyScheduleCss()
    applyTheme()
    tick(true)
  })

  ipcRenderer.on('setDayOffset', (e, arg) => {
    ipcRenderer.send('dialog', {
      reply: 'getDayOffset',
      options: {
        title: '切换日程',
        message: '请选择要切换到的日程',
        buttons: scheduleConfig.daily_class.map(day => day.Chinese),
        cancelId: -1,
        defaultId: getCurrentEditedDay(new Date())
      }
    })
  })

  ipcRenderer.on('getDayOffset', (e, arg) => {
    if (arg.index === -1) return
      localStorage.setItem('dayOffset', arg.index.toString())
      localStorage.setItem('setDayOffsetLastDay', new Date().getDay().toString())
      dayOffset = arg.index
      setDayOffsetLastDay = new Date().getDay()
      tick(true)
  })

  // ===== 上下课 / 自定义提醒检测 =====
  let lastReminderState = { classIndex: null, type: null, fired: {} };
  let firedCustomDate = {};

  function getTodayKey() {
    const d = getCurrentEditedDate();
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }

  function checkReminders(sd) {
    const rc = settings?.reminder_class || {};
    const hl = sd.currentHighlight;
    if (!hl) return;
    const dayIdx = getCurrentDayScheduleIndex();
    const sessionKey = (kind, idx) => `${dayIdx}_${idx}_${kind}`;

    // 即将上课：处于课间（isBreak=true 且 type=upcoming）且倒计时 <= N 秒
    if (rc.upcoming_enabled && hl.isBreak && hl.type === 'upcoming' && hl.index !== null) {
      const cd = hl.countdown;
      const secs = Number(rc.upcoming_seconds) || 300;
      const key = sessionKey('upcoming', hl.index);
      if (cd !== null && cd > 0 && cd <= secs && !lastReminderState.fired[key]) {
        lastReminderState.fired[key] = true;
        triggerReminderMask({ text: rc.upcoming_text || '即将上课', color: 'rgba(0,200,0,0.85)', duration: 5000 });
      }
    }

    // 上课：从非 current 变为 current
    if (rc.start_enabled && hl.type === 'current' && hl.index !== null) {
      const key = sessionKey('start', hl.index);
      if (lastReminderState.type !== 'current' && !lastReminderState.fired[key]) {
        lastReminderState.fired[key] = true;
        triggerReminderMask({ text: rc.start_text || '上课', color: 'rgba(0,200,0,0.85)', duration: 5000 });
      }
    }

    // 下课：从 current 变为非 current
    if (rc.end_enabled && lastReminderState.type === 'current' && hl.type !== 'current' && lastReminderState.classIndex !== null) {
      const key = sessionKey('end', lastReminderState.classIndex);
      if (!lastReminderState.fired[key]) {
        lastReminderState.fired[key] = true;
        triggerReminderMask({ text: rc.end_text || '下课', color: 'rgba(200,180,0,0.85)', duration: 5000 });
      }
    }

    lastReminderState.classIndex = hl.index;
    lastReminderState.type = hl.type;

    // 自定义文本提醒
    const customs = settings?.reminder_custom || [];
    if (Array.isArray(customs) && customs.length) {
      // getCurrentTime() 返回 HH:MM:SS，提醒时间是 HH:MM，取前 5 位按分钟比较
      const nowMin = getCurrentTime().slice(0, 5);
      const today = getTodayKey();
      customs.forEach((item) => {
        if (!item || !item.time) return;
        const t = String(item.time).trim().slice(0, 5);
        if (!/^\d{2}:\d{2}$/.test(t)) return;
        const id = item.id || item.time;
        if (firedCustomDate[id] === today) return;
        if (nowMin === t) {
          firedCustomDate[id] = today;
          triggerReminderMask({ text: item.text || '提醒', color: item.color || settings?.reminder_color || '', duration: Number(item.duration) || 5000 });
        }
      });
    }
  }

  // ===== 提醒遮罩 =====
  const reminderMask = document.getElementById('reminderMask');
  const reminderText = document.getElementById('reminderText');
  let reminderHideTimer = null;

  function triggerReminderMask(payload = {}) {
    const text = String(payload.text ?? '').trim();
    reminderText.textContent = text;
    reminderText.style.display = text ? '' : 'none';
    const scheduleEl = document.querySelector('.scheduleComponent') || globalContainer;
    const rect = scheduleEl.getBoundingClientRect();
    reminderMask.style.left = `${rect.left}px`;
    reminderMask.style.top = `${rect.top}px`;
    reminderMask.style.width = `${rect.width}px`;
    reminderMask.style.height = `${rect.height}px`;
    reminderMask.style.setProperty('--reminder-x', `${rect.width / 2}px`);
    reminderMask.style.setProperty('--reminder-y', `${rect.height / 2}px`);
    reminderMask.style.setProperty('--reminder-r', `${Math.ceil(Math.hypot(rect.width, rect.height) / 2) + 2}px`);
    const color = String(payload.color || settings?.reminder_color || '').trim();
    if (color) reminderMask.style.setProperty('--reminder-bg-color', color);
    else reminderMask.style.removeProperty('--reminder-bg-color');
    clearTimeout(reminderHideTimer);
    reminderMask.classList.remove('closing');
    reminderMask.classList.add('active');
    void reminderMask.offsetWidth;
    reminderMask.classList.add('shown');
    const duration = Number(payload.duration);
    reminderHideTimer = setTimeout(hideReminderMask, Number.isFinite(duration) && duration > 0 ? duration : 5000);
  }

  function hideReminderMask() {
    clearTimeout(reminderHideTimer);
    reminderHideTimer = null;
    if (!reminderMask.classList.contains('active') || reminderMask.classList.contains('closing')) return;
    reminderMask.classList.add('closing');
    setTimeout(() => {
      reminderMask.classList.remove('active', 'shown', 'closing');
    }, 1100);
  }

  reminderMask.addEventListener('click', hideReminderMask);

  ipcRenderer.on('reminder-trigger', (e, payload) => {
    if (payload && payload.action === 'hide') hideReminderMask();
    else triggerReminderMask(payload);
  })
</script>

</html>
