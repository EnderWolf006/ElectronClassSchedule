<!DOCTYPE html>
<html lang="ch" id="html">

<head>
  <title>电子课表</title>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="text/javascript" src="js/jquery.min.js"></script>
  <script type="text/javascript" src="js/index.js"></script>
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <script type="text/javascript" src="js/themePack.js"></script>
</head>

<body>
  <div class="globalContainer" id="globalContainer">
    <div id="componentRows" class="componentRows">
      <div class="componentRow" data-component-row="0">
        <div class="scheduleComponent" data-component-slot="schedule">
          <div class="classContainer background" id="classContainer">
            <div class="class">加</div>
            <div class="class">载</div>
            <div class="class">中</div>
          </div>
          <div class="countdownContainer" id="countdownContainer">
            <div class="triangle"></div>
            <div class="countdowner" id="countdowner">
              <div class="currentClass" id="currentFullName">Loading</div>
              <div class="countdown" id="countdownText">00:00</div>
              <div class="countdownProgress"><i></i></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="miniCountdown" id="miniCountdown">00:00</div>
  <div class="reminderMask notIgnoreClick" id="reminderMask">
    <div class="reminderText" id="reminderText"></div>
  </div>

</body>
<script>
  const { ipcRenderer } = require('electron');
  let scheduleData = {
    scheduleArray: [],
    currentHighlight: { index: null, type: null, fullName: 'Loading', countdown: null, countdownText: '00:00' },
    timetable: null,
    divider: []
  };
  let globalContainer = document.getElementById('globalContainer')
  let classContainer = document.getElementById('classContainer')
  let countdownContainer = document.getElementById('countdownContainer')
  let countdowner = document.getElementById('countdowner')
  let currentFullName = document.getElementById('currentFullName')
  let countdownText = document.getElementById('countdownText')
  let inlineCountdown = document.querySelector('.inlineCountdown')
  let weekEN = document.getElementById('weekEN')
  let weekCH = document.getElementById('weekCH')
  let countdownDays = document.getElementById('countdownDays')
  let currentTime = document.getElementById('currentTime')
  let miniCountdown = document.getElementById('miniCountdown')
  let rightSidebar = document.getElementById('rightSidebar')
  let leftSidebar = document.getElementById('leftSidebar')
  let root = document.querySelector(':root');
  let componentRows = document.getElementById('componentRows')
  let isClassCountdown = true
  let isClassHidden = false
  // 从 localStorage 恢复：设置变更触发 reload 后首帧即为正确状态，
  // 不必等主进程重新下发 IPC，避免“次日课表”闪断
  let showNextDayAfterSchool = localStorage.getItem('showNextDayAfterSchool') === '1'
  // 位置模式首帧：同步读 localStorage 缓存（loadScheduleConfig 是异步的），
  // 避免 reload 后异步加载配置期间按旧位置渲染一帧
  document.documentElement.dataset.position = localStorage.getItem('windowPositionMode') || 'top'
  let lastScheduleData = {
    currentHighlight: {
      index: null,
      type: null,
      fullName: null,
      countdown: null,
      countdownText: null
    },
    scheduleArray: [null, null, null],
    timetable: null,
    divider: [null, null]
  }

  function getComponentLayout() {
    const configured = Array.isArray(settings.component_layout) ? settings.component_layout : [['schedule', 'week', 'countdown']];
    let legacyIndex = 0;
    const rows = configured.map(row => Array.isArray(row) ? row.map(component => {
      if (typeof component === 'string') return { id: `${component}-${++legacyIndex}`, type: component, options: {} };
      return component && (['schedule', 'week', 'date', 'countdown', 'time', 'weather', 'customText'].includes(component.type) || isPluginComponentType(component.type))
        ? { id: component.id || `${component.type}-${++legacyIndex}`, type: component.type, options: component.options || {} } : null;
    }).filter(Boolean) : []).filter(row => row.length);
    return rows.length ? rows : [[{ id: 'schedule-1', type: 'schedule', options: {} }]];
  }

  // ===== 插件宿主 =====
  // 插件 renderer.js 通过 window.pluginHost.registerComponent(type, { render, update }) 注册新组件；
  // 主界面把组件渲染为 .pluginComponent 容器，并调用插件自己的渲染函数。
  const pluginComponents = {};
  const pluginTickCallbacks = [];
  window.pluginHost = {
    registerComponent(type, definition) {
      if (typeof type !== 'string' || !type.trim() || !definition || typeof definition.render !== 'function') return;
      pluginComponents[type.trim()] = definition;
      // 已渲染过的界面（热启用插件时）重建布局，让新组件立刻出现
      if (componentRows.children.length) {
        try { renderComponentLayout(); } catch (error) { console.error('[plugin] 组件注册后重建布局失败:', error); }
      }
    },
    onTick(callback) {
      if (typeof callback === 'function') pluginTickCallbacks.push(callback);
    },
    getScheduleData: () => scheduleData,
    getSettings: () => settings,
    ipcRenderer,
  };

  function isPluginComponentType(type) {
    return Object.prototype.hasOwnProperty.call(pluginComponents, type);
  }

  function runPluginComponentHooks(mode) {
    const instances = getComponentLayout().flat().filter((component) => isPluginComponentType(component.type));
    instances.forEach((component) => {
      const element = document.querySelector(`[data-component-id="${component.id}"]`);
      const definition = pluginComponents[component.type];
      if (!element || !definition) return;
      try {
        const hook = mode === 'render' ? definition.render : definition.update;
        if (typeof hook === 'function') hook(element, component.options || {}, window.pluginHost);
      } catch (error) {
        console.error(`[plugin] 组件 ${component.type} ${mode} 失败:`, error);
      }
    });
  }

  // 按启用列表顺序注入插件渲染脚本（脚本内注册组件后再渲染布局）
  function loadEnabledPlugins() {
    return ipcRenderer.invoke('get-enabled-plugins').then((plugins) => {
      const list = Array.isArray(plugins) ? plugins : [];
      return list.reduce((chain, plugin) => chain.then(() => {
        if (!plugin || !plugin.renderer) return null;
        return new Promise((resolve) => {
          const script = document.createElement('script');
          script.src = plugin.renderer;
          script.setAttribute('data-plugin', plugin.id);
          script.onload = () => resolve(null);
          script.onerror = () => { console.error('[plugin] 渲染脚本加载失败:', plugin.id); resolve(null); };
          document.head.appendChild(script);
        });
      }), Promise.resolve());
    }).catch((error) => { console.error('[plugin] 获取插件列表失败:', error); });
  }

  function renderComponentLayout() {
    const layout = getComponentLayout();
    componentRows.innerHTML = layout.map((row, rowIndex) => `
      <div class="componentRow" data-component-row="${rowIndex}">
        ${row.map(component => {
          if (component.type === 'schedule') return `
            <div class="scheduleComponent" data-component-slot="schedule" data-component-id="${component.id}">
              <div class="classContainer background" id="classContainer">
                <div class="class">加</div><div class="class">载</div><div class="class">中</div>
              </div>
              <div class="countdownContainer" id="countdownContainer">
                <div class="triangle"></div>
                <div class="countdowner" id="countdowner">
                  <div class="currentClass" id="currentFullName">Loading</div>
                  <div class="countdown" id="countdownText">00:00</div>
                  <div class="countdownProgress"><i></i></div>
                </div>
              </div>
            </div>`;
          if (component.type === 'week') return `<div class="leftSidebar sidebar background" data-component-slot="week" data-component-id="${component.id}"><span class="weekEN t">Load</span><div class="corner options notIgnoreClick weekCH">ing</div></div>`;
          if (component.type === 'date') return `<div class="leftSidebar sidebar background" data-component-slot="date" data-component-id="${component.id}"><span class="dateValue t">00/00</span><div class="corner options notIgnoreClick dateWeek">周一</div></div>`;
          if (component.type === 'time') return `<div class="timeSidebar sidebar background" data-component-slot="time" data-component-id="${component.id}"><span class="currentTime t">00:00:00</span></div>`;
          if (component.type === 'weather') return `<div class="weatherSidebar sidebar background" data-component-slot="weather" data-component-id="${component.id}"><span class="weatherLine t"><span class="weatherEmoji">🌡️</span><span class="weatherTemp">--°</span></span><div class="corner weatherCity">天气</div></div>`;
          if (component.type === 'customText') return `<div class="customText background" data-component-slot="customText" data-component-id="${component.id}"></div>`;
          if (isPluginComponentType(component.type)) return `<div class="pluginComponent background" data-component-slot="plugin" data-component-id="${component.id}" data-plugin-type="${component.type}"></div>`;
          return `<div class="rightSidebar sidebar background" data-component-slot="countdown" data-component-id="${component.id}"><span class="countdownDays t">000</span><div class="corner">天</div><div class="dateProgress"><i></i></div></div>`;
        }).join('')}
      </div>
    `).join('');
    classContainer = document.getElementById('classContainer');
    countdownContainer = document.getElementById('countdownContainer');
    currentFullName = document.getElementById('currentFullName');
    countdownText = document.getElementById('countdownText');
    inlineCountdown = document.querySelector('.inlineCountdown');
    weekEN = document.querySelector('.weekEN');
    weekCH = document.querySelector('.weekCH');
    countdownDays = document.querySelector('.countdownDays');
    currentTime = document.querySelector('.currentTime');
    document.querySelectorAll('[data-component-slot="customText"]').forEach((el) => {
      const match = layout.flat().find((component) => component.id === el.dataset.componentId);
      if (match) el.textContent = match.options.text ?? '';
    });
    rightSidebar = document.querySelector('[data-component-slot="countdown"]');
    leftSidebar = document.querySelector('[data-component-slot="week"]');
    // 布局重建后请插件渲染自己的组件
    runPluginComponentHooks('render');
  }

  function setScheduleClass() {
    let classHtml = '';
    const fusion = scheduleData.fusion;
    const highlightedIndex = scheduleData.currentHighlight.displayIndex ?? scheduleData.currentHighlight.index;
    // 右侧竖排模式下行已变为列，没有“下方组件”的概念：
    // 高亮课程/课间始终展开为“全称 + 内联倒计时”，变色规则不变
    const isRightLayout = document.documentElement.dataset.position === 'right';
    // “课上计时”只控制上课中的倒计时；课间倒计时始终显示
    // “倒计时样式”：顶部居中 / 顶部靠右时可由用户在“软件设置 → 基础设置”中选择
    // “下方悬浮”或“内嵌”；右侧竖排（行即列）与“课表行下方还有组件”时始终内嵌，
    // 避免悬浮倒计时框遮挡下方组件
    const wantInlineCountdown = settings?.countdown_style === 'inline';
    const showInlineCountdown = (isRightLayout || wantInlineCountdown || hasComponentBelowSchedule())
      && (isClassCountdown || scheduleData.currentHighlight.isBreak);
    if (scheduleData.currentHighlight.isNextDay) {
      classHtml += '<div class="class breakClassExpanded stateTransition">明天</div>';
    }
    for (let i = 0; i < scheduleData.scheduleArray.length; i++) {
      const isBreakPosition = showInlineCountdown && scheduleData.currentHighlight.isBreak && scheduleData.currentHighlight.index === i && i < scheduleData.scheduleArray.length;
      const isFusionStart = fusion && i === fusion.start;
      const isInsideFusion = fusion && i >= fusion.start && i <= fusion.end;
      if (isBreakPosition) {
        classHtml += `<div class="class breakClassExpanded stateTransition" id="highlighted"><span class="expandedClassName"></span><span class="inlineCountdown">${scheduleData.currentHighlight.countdownText}</span><span class="inlineProgress"><i></i></span></div>`;
      }
      if (!isBreakPosition && scheduleData.divider.indexOf(i) != -1)
        classHtml += '<div class="divider"></div>'
      if (isInsideFusion && !isFusionStart) continue;
      let inner = scheduleData.scheduleArray[i]
      if (isFusionStart && fusion.subject) inner = fusion.subject;
      if (inner === undefined || inner === null) inner = ''
      inner = String(inner)
      // 右侧竖排模式下每个格子空间充足，简称经 subject_name 映射为全称显示。
      // 先按完整 key 查（角标课程如“周练@物”→“物理周练”直接命中），
      // 未命中再退化为只映射主名、保留 @ 后缀的小字部分
      if (isRightLayout) {
        const mappedFull = window.scheduleConfig?.subject_name?.[inner];
        if (mappedFull) {
          inner = mappedFull;
        } else {
          const atIndex = inner.indexOf('@');
          const shortName = atIndex === -1 ? inner : inner.slice(0, atIndex);
          const mappedFullName = window.scheduleConfig?.subject_name?.[shortName];
          if (mappedFullName) inner = atIndex === -1 ? mappedFullName : `${mappedFullName}@${inner.slice(atIndex + 1)}`;
        }
      }
      if (inner.indexOf('@') != -1) {
        inner = `<div><div style="display:inline">${inner.split('@')[0]}</div><div class="subClass">${inner.split('@')[1]}</div></div>`
      }
      if (highlightedIndex == i && scheduleData.currentHighlight.isBreak && !showInlineCountdown) {
        classHtml += `<div class="class upcoming" id="highlighted">${inner}</div>`
      }
      else if (highlightedIndex == i && !scheduleData.currentHighlight.isBreak) {
        if (scheduleData.currentHighlight.type === 'current') {
          if (showInlineCountdown)
            classHtml += `<div class="class current currentClassExpanded stateTransition" id="highlighted"><span class="expandedClassName"></span><span class="inlineCountdown">${scheduleData.currentHighlight.countdownText}</span><span class="inlineProgress"><i></i></span></div>`
          else
            classHtml += `<div class="class current" id="highlighted">${inner}</div>`
        }
        else if (scheduleData.currentHighlight.isEnd)
          classHtml += `<div class="class ended" id="highlighted">${inner}</div>`
        else if (scheduleData.currentHighlight.type === 'upcoming')
          classHtml += `<div class="class upcoming" id="highlighted">${inner}</div>`
      }
      else {
        if (scheduleData.currentHighlight.index > i)
          classHtml += `<div class="class ended">${inner}</div>`
        else
          classHtml += `<div class="class">${inner}</div>`
      }
    }
    if (showInlineCountdown && scheduleData.currentHighlight.isBreak && scheduleData.currentHighlight.index === scheduleData.scheduleArray.length) {
      classHtml += `<div class="class breakClassExpanded stateTransition" id="highlighted"><span class="expandedClassName"></span><span class="inlineCountdown">${scheduleData.currentHighlight.countdownText}</span><span class="inlineProgress"><i></i></span></div>`;
    }
    // 时间点晚于全部时间段的分割线：显示在最后一节课之后
    if (scheduleData.divider.indexOf(scheduleData.scheduleArray.length) != -1)
      classHtml += '<div class="divider"></div>'
    document.querySelectorAll('.scheduleComponent .classContainer').forEach((element) => {
      element.innerHTML = classHtml;
      const expandedClassName = element.querySelector('.expandedClassName');
      if (expandedClassName) expandedClassName.textContent = scheduleData.currentHighlight.fullName || '';
    });
    classContainer = document.querySelector('.scheduleComponent .classContainer');
    inlineCountdown = classContainer?.querySelector('.inlineCountdown');
  }

  function setBackgroundDisplay() {
    let elements = document.getElementsByClassName('background')
    for (element of elements) {
      element.style.visibility = (scheduleData.currentHighlight.type === 'current' && isClassHidden) ? 'hidden' : 'visible'
    }
  }

  function hasComponentBelowSchedule() {
    const scheduleComponent = document.querySelector('.scheduleComponent');
    const scheduleRow = scheduleComponent?.closest('.componentRow');
    if (!scheduleRow) return false;
    let row = scheduleRow.nextElementSibling;
    while (row) {
      if (row.querySelector('[data-component-slot]')) return true;
      row = row.nextElementSibling;
    }
    return false;
  }

  // ===== 悬浮倒计时框显隐（0px 展开 / 收起动画） =====
  // 状态机：null=首帧（直接落地不播动画）/ true=显示 / false=隐藏。
  // 收起动画播放期间节点 display 仍为 block，由 countdownHiding 标记，
  // 防止 tick 每拍“校正 display”把动画半途掐掉。
  let countdownPopupState = null
  const countdownHiding = new WeakSet()
  // 每个悬浮窗正在播放显隐动画时的 rAF 句柄（快速来回切换时取消旧循环）
  const popupAnimFrames = new WeakMap()

  // 悬浮窗 0px 展开/收起期间，窗口高度必须随动画逐帧生长/收缩；
  // 仅靠每秒一次的 tick 上报会让窗口在整段动画结束后才 resize，
  // 弹出框被裁在视口外，用户看不到展开动画（“课上计时”关闭→打开即如此）。
  function pumpWindowBoundsWhileAnimating(el, anim) {
    cancelAnimationFrame(popupAnimFrames.get(el) || 0)
    const pump = () => {
      if (anim.playState !== 'running') {
        popupAnimFrames.delete(el)
        // 终态（display 已在 onfinish 落地）再校正一次窗口尺寸
        reportWindowBounds()
        return
      }
      reportWindowBounds()
      popupAnimFrames.set(el, requestAnimationFrame(pump))
    }
    popupAnimFrames.set(el, requestAnimationFrame(pump))
  }

  function animateCountdownContainer(el, show) {
    if (show) {
      el.style.display = 'block'
      const height = el.offsetHeight || el.scrollHeight
      if (height > 0) {
        const anim = el.animate([
          { height: '0px', opacity: 0, overflow: 'hidden' },
          { height: height + 'px', opacity: 1, overflow: 'hidden' }
        ], { duration: 300, easing: 'cubic-bezier(.22,.9,.26,1.08)' })
        pumpWindowBoundsWhileAnimating(el, anim)
      }
    } else {
      if (el.style.display === 'none' || countdownHiding.has(el)) return
      const height = el.offsetHeight
      if (height <= 0) { el.style.display = 'none'; return }
      countdownHiding.add(el)
      const anim = el.animate([
        { height: height + 'px', opacity: 1, overflow: 'hidden' },
        { height: '0px', opacity: 0, overflow: 'hidden' }
      ], { duration: 220, easing: 'ease-in' })
      pumpWindowBoundsWhileAnimating(el, anim)
      anim.onfinish = () => {
        countdownHiding.delete(el)
        // 播完才真正 display:none；期间若已切回显示则保留
        if (countdownPopupState === false) el.style.display = 'none'
      }
    }
  }

  function setCountdownPopupDisplay(visible) {
    const containers = document.querySelectorAll('.scheduleComponent .countdownContainer')
    if (countdownPopupState === null) {
      countdownPopupState = visible
      containers.forEach((el) => { el.style.display = visible ? 'block' : 'none' })
      return
    }
    if (visible !== countdownPopupState) {
      countdownPopupState = visible
      containers.forEach((el) => animateCountdownContainer(el, visible))
      return
    }
    // 状态不变：仅校正 display（布局重建后新节点需要同步；收起动画中的节点跳过）
    containers.forEach((el) => {
      if (visible) el.style.display = 'block'
      else if (!countdownHiding.has(el)) el.style.display = 'none'
    })
  }

  // 位置切换期间调用：取消悬浮倒计时框正在播放的 0px 展开/收起动画，
  // 并让下一次 tick 按新布局直接落到终态 display（状态机置 null = 首帧不播动画）。
  // 否则尺寸测量会取到动画中间高度（如回程时窗口高度先变 87、再跳 574/230）。
  // 调用时 body.position-switching 遮罩仍在，用户看不到这次瞬变。
  function finalizeCountdownPopupImmediately() {
    document.querySelectorAll('.scheduleComponent .countdownContainer').forEach((el) => {
      el.getAnimations().forEach((anim) => anim.cancel())
      countdownHiding.delete(el)
    })
    countdownPopupState = null
    tick(true)
  }

  // ===== 倒计时进度条：随当前时间段（上课/课间）每秒推进 =====
  function updateCountdownProgress() {
    const highlight = scheduleData.currentHighlight;
    const has = typeof highlight.progress === 'number';
    const pct = has ? Math.round(highlight.progress * 1000) / 10 : 0;
    const color = highlight.type === 'current' ? 'var(--col-current)' : 'var(--col-break)';
    // 将 classContainer 的水平 padding 写入 CSS 变量，供竖排进度条负边距使用
    const cc = document.querySelector('.scheduleComponent .classContainer');
    if (cc) {
      const style = getComputedStyle(cc);
      root.style.setProperty('--cc-padding-x', style.paddingLeft);
    }
    const instances = getComponentLayout().flat();
    document.querySelectorAll('.scheduleComponent').forEach((sc) => {
      const instance = instances.find((component) => component.id === sc.dataset.componentId);
      const enabled = instance ? instance.options.showProgress !== false : true;
      const visible = enabled && has;
      sc.querySelectorAll('.countdownProgress, .inlineProgress').forEach((bar) => {
        bar.style.display = visible ? '' : 'none';
        const fill = bar.querySelector('i');
        if (fill) {
          fill.style.width = pct + '%';
          fill.style.background = color;
        }
      });
    });
    // “上课隐藏”时的顶部小窗：跟随第一个课表组件实例的开关
    const anyEnabled = instances.some((component) => component.type === 'schedule' && component.options.showProgress !== false);
    const miniBar = miniCountdown.querySelector('.miniProgress');
    if (miniBar) {
      miniBar.style.display = anyEnabled && has ? '' : 'none';
      const fill = miniBar.querySelector('i');
      if (fill) {
        fill.style.width = pct + '%';
        fill.style.background = color;
      }
    }
  }

  function setCountdownerContent() {
    if (!currentFullName || !countdownText || !countdownContainer || !miniCountdown) return;
    if (scheduleData.currentHighlight.isNextDay) {
      miniCountdown.style.display = 'none';
      setCountdownPopupDisplay(false);
      return;
    }
    // 当前时间不在任何时间段内（上学前/放学后/时间表空档）：
    // 没有计时目标，小三角形与下方悬浮倒计时框一起隐藏
    if (!scheduleData.currentHighlight.type) {
      miniCountdown.style.display = 'none';
      setCountdownPopupDisplay(false);
      return;
    }
    currentFullName.innerText = scheduleData.currentHighlight.fullName;
    // 使用 CSS 变量，使浅色模式下自动应用深绿/深黄（与课表组件一致），深色模式保持亮绿/亮黄
    currentFullName.style.color = scheduleData.currentHighlight.type === 'current' ? 'var(--col-current)' : 'var(--col-break)'
    countdownText.innerText = scheduleData.currentHighlight.countdownText;
    if (inlineCountdown) {
      inlineCountdown.innerText = scheduleData.currentHighlight.countdownText;
      // 课间倒计时不受“课上计时”开关影响
      inlineCountdown.style.display = (isClassCountdown || scheduleData.currentHighlight.isBreak) ? 'inline' : 'none';
    }
    const isRightLayout = document.documentElement.dataset.position === 'right';
    let popupVisible = true;
    // 用户在“软件设置 → 基础设置”里显式选择“内嵌倒计时”时，
    // 任何模式下都不再弹出下方悬浮倒计时框（即使课表行下方没有组件）
    const inlineChosen = settings?.countdown_style === 'inline';
    if (scheduleData.currentHighlight.type === 'current') {
      if (isClassCountdown) {
        if (isClassHidden) { // 上课隐藏 -> 显示顶部小窗口（与布局模式无关）
          popupVisible = false;
          miniCountdown.style.display = 'block'
          miniCountdown.innerHTML = `<div class="currentClass">${currentFullName.innerText = scheduleData.currentHighlight.fullName}</div><div class="countdown" style="margin-left:5px">${scheduleData.currentHighlight.countdownText}</div><div class="miniProgress"><i></i></div>`
        } else if (isRightLayout || inlineChosen || hasComponentBelowSchedule()) {
          // 倒计时已内联在高亮格子中（right 模式/用户选择内嵌），不重复显示倒计时框
          popupVisible = false;
          miniCountdown.style.display = 'none';
        } else {
          popupVisible = true;
          miniCountdown.style.display = 'none';
        }
      } else { // 上课 并且关闭了倒计时 -> 都不显示
        popupVisible = false;
        miniCountdown.style.display = 'none'
      }
    }
    else if (scheduleData.currentHighlight.isBreak) {
      // 课间倒计时窗口始终显示，与“课上计时”开关无关；选择内嵌时同样不弹出
      popupVisible = !isRightLayout && !inlineChosen && !hasComponentBelowSchedule();
      miniCountdown.style.display = 'none';
    }
    else { // 下一节课预告：倒计时框正常显示（right 模式下定位在课程列底部）
      popupVisible = !inlineChosen;
      miniCountdown.style.display = 'none'
    }
    document.querySelectorAll('.scheduleComponent .countdowner').forEach((element) => {
      const name = element.querySelector('.currentClass');
      const countdown = element.querySelector('.countdown');
      if (name) {
        name.innerText = scheduleData.currentHighlight.fullName;
        name.style.color = currentFullName.style.color;
      }
      if (countdown) countdown.innerText = scheduleData.currentHighlight.countdownText;
    });
    setCountdownPopupDisplay(popupVisible);
  }

  function setCountdownerPosition() {
    if (!countdownContainer || !classContainer) return;
    let highlightElement = document.getElementById('highlighted')
    if (!highlightElement) return;
    let offset = {}
    if (scheduleData.currentHighlight.type === 'current') {
      offset = {
        x: highlightElement.offsetLeft - countdownContainer.offsetWidth / 2 + highlightElement.offsetWidth / 2,
        y: classContainer.offsetHeight
      }
    } else if (scheduleData.currentHighlight.type === 'upcoming') {
      if (scheduleData.currentHighlight.index != 0 && scheduleData.divider.indexOf(scheduleData.currentHighlight.index) != -1) {
        offset = {
          x: highlightElement.offsetLeft - countdownContainer.offsetWidth / 2 - Number(getComputedStyle(highlightElement).marginLeft.replace('px', '')) - getComputedStyle(root).getPropertyValue('--divider-width').replace('px', '') / 2 - getComputedStyle(root).getPropertyValue('--divider-margin').replace('px', ''),
          y: classContainer.offsetHeight
        }
      } else {
        offset = {
          x: highlightElement.offsetLeft - countdownContainer.offsetWidth / 2 - Number(getComputedStyle(highlightElement).marginLeft.replace('px', '')),
          y: classContainer.offsetHeight
        }
      }
    }
    if (scheduleData.currentHighlight.isEnd) {
      offset = {
        x: highlightElement.offsetLeft - countdownContainer.offsetWidth / 2 + highlightElement.offsetWidth + Number(getComputedStyle(highlightElement).marginLeft.replace('px', '')),
        y: classContainer.offsetHeight
      }
    }
    countdownContainer.style.left = offset.x + 'px'
    countdownContainer.style.top = offset.y + 'px'
  }

  // ===== 天气组件：主进程代理请求，10 分钟刷新一次 =====
  const weatherDataMap = new Map(); // componentId -> {city,temp,text,emoji} | {error:true}

  function renderWeatherComponents() {
    getComponentLayout().flat().filter((component) => component.type === 'weather').forEach((component) => {
      const element = document.querySelector(`[data-component-id="${component.id}"]`);
      if (!element) return;
      const data = weatherDataMap.get(component.id);
      const emojiEl = element.querySelector('.weatherEmoji');
      const tempEl = element.querySelector('.weatherTemp');
      const cityEl = element.querySelector('.weatherCity');
      if (data && !data.error) {
        // 天气设置 → 天气图标包：选择“纯文本”时隐藏图标，只显示文字与温度
        const iconTextOnly = settings?.weather?.icon_pack === 'text';
        if (emojiEl) {
          emojiEl.innerText = data.emoji || '🌡️';
          emojiEl.style.display = iconTextOnly ? 'none' : '';
        }
        if (tempEl) tempEl.innerText = data.temp === null ? '--°' : `${data.temp}°`;
        if (cityEl) cityEl.innerText = data.text ? `${data.city || ''} ${data.text}`.trim() : (data.city || '天气');
      } else if (data && data.error) {
        if (emojiEl) { emojiEl.innerText = '🌡️'; emojiEl.style.display = ''; }
        if (tempEl) tempEl.innerText = '--°';
        if (cityEl) cityEl.innerText = '天气不可用';
      }
    });
  }

  let weatherRetryTimer = null;
  async function refreshWeather() {
    const instances = getComponentLayout().flat().filter((component) => component.type === 'weather');
    let hasError = false;
    await Promise.all(instances.map(async (component) => {
      try {
        const data = await ipcRenderer.invoke('get-weather', component.options.city || '');
        if (data && data.error) hasError = true;
        weatherDataMap.set(component.id, data);
      } catch (error) {
        hasError = true;
        weatherDataMap.set(component.id, { error: true });
      }
    }));
    renderWeatherComponents();
    // 启动时网络未就绪/接口偶发失败：1 分钟后快速重试，不必干等 10 分钟轮询
    clearTimeout(weatherRetryTimer);
    if (hasError) weatherRetryTimer = setTimeout(refreshWeather, 60 * 1000);
  }

  function setSidebar() {
    const editedDate = getCurrentEditedDate()
    const instances = getComponentLayout().flat();
    const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
    const month = String(editedDate.getMonth() + 1).padStart(2, '0');
    const day = String(editedDate.getDate()).padStart(2, '0');
    instances.filter((component) => component.type === 'date').forEach((component) => {
      const element = document.querySelector(`[data-component-id="${component.id}"]`);
      if (!element) return;
      element.querySelector('.dateValue').innerText = `${month}/${day}`;
      element.querySelector('.dateWeek').innerText = `周${dayNames[editedDate.getDay()]}`;
    });
    let data = getCurrentDayScheduleConfig()
    if (!data) return
    instances.filter((component) => component.type === 'week').forEach((component) => {
      const element = document.querySelector(`[data-component-id="${component.id}"]`);
      if (!element) return;
      element.querySelector('.weekCH').innerText = data.Chinese;
      element.querySelector('.weekEN').innerText = data.English;
      element.style.display = component.options.display === false ? 'none' : '';
    });
    instances.filter((component) => component.type === 'time').forEach((component) => {
      const element = document.querySelector(`[data-component-id="${component.id}"] .currentTime`);
      if (element) element.innerText = (component.options.source === 'system' ? new Date() : editedDate).toLocaleTimeString('zh-CN', { hour12: false });
    });
    instances.filter((component) => component.type === 'customText').forEach((component) => {
      const element = document.querySelector(`[data-component-id="${component.id}"]`);
      if (element) element.textContent = component.options.text ?? '';
    });
    // 天气内容本身由 refreshWeather 定时拉取，这里只负责布局重建后回填
    renderWeatherComponents();
    instances.filter((component) => component.type === 'countdown').forEach((component) => {
      const element = document.querySelector(`[data-component-id="${component.id}"]`);
      if (!element) return;
      const target = component.options.target || scheduleConfig.countdown_target;
      element.style.display = target === 'hidden' ? 'none' : '';
      const value = target && target !== 'hidden' ? Math.ceil(Math.abs(new Date(target) - editedDate) / (1000 * 60 * 60 * 24)) : 0;
      const days = element.querySelector('.countdownDays');
      if (days) {
        days.innerText = value;
        days.style.color = component.options.color || '';
      }
      // 可选进度条：起止日期均为用户自定义日期，按整天计算 0~1
      const bar = element.querySelector('.dateProgress');
      if (bar) {
        const startDate = component.options.start ? new Date(component.options.start) : null;
        const endDate = target && target !== 'hidden' ? new Date(target) : null;
        const valid = startDate && endDate && !Number.isNaN(startDate) && !Number.isNaN(endDate) && endDate > startDate;
        const show = component.options.showProgress === true && valid;
        bar.style.display = show ? '' : 'none';
        if (show) {
          const noon = (date) => new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
          const progress = Math.min(1, Math.max(0,
            (noon(editedDate) - noon(startDate)) / (noon(endDate) - noon(startDate))));
          const fill = bar.querySelector('i');
          fill.style.width = `${Math.round(progress * 1000) / 10}%`;
          // 进度条颜色跟随倒计日期数字颜色
          fill.style.background = component.options.color || '';
        }
      }
    });
    // 插件组件的内容刷新（由组件自己决定是否重绘）
    runPluginComponentHooks('update');
  }

  function tick(reset = false) {
    scheduleData = getScheduleData();
    setCountdownerContent()
    setSidebar()
    if (JSON.stringify(scheduleData.scheduleArray) != JSON.stringify(lastScheduleData.scheduleArray) ||
      scheduleData.currentHighlight.index != lastScheduleData.currentHighlight.index ||
      scheduleData.currentHighlight.fullName != lastScheduleData.currentHighlight.fullName ||
      scheduleData.currentHighlight.type != lastScheduleData.currentHighlight.type ||
      scheduleData.currentHighlight.isNextDay != lastScheduleData.currentHighlight.isNextDay || reset) {
      setScheduleClass()
      setCountdownerPosition()
      setBackgroundDisplay()
    }
    updateCountdownProgress()
    // 插件组件的动态刷新（每次 tick 一次，插件自行控制内部节流）
    pluginTickCallbacks.forEach((callback) => {
      try { callback(scheduleData); } catch (error) { console.error('[plugin] tick 回调失败:', error); }
    })
    lastScheduleData = $.extend(true, {}, scheduleData)
    checkReminders(scheduleData)
  }


  function applyScheduleCss() {
    if (!root) return;
    for (const key in settings.css_style) {
      root.style.setProperty(key, settings.css_style[key])
    }
  }

  // ===== 自定义样式 =====
  // settings.custom_css 为任意 CSS 文本，以 <style id="customCss"> 注入到 head 末尾，
  // 优先级高于 css/style.css 与主题包，相当于可对默认样式做完全重构。
  function applyCustomCss() {
    let el = document.getElementById('customCss');
    if (!el) {
      el = document.createElement('style');
      el.id = 'customCss';
      document.head.appendChild(el);
    }
    el.textContent = String(settings?.custom_css || '');
  }

  // ===== 主题切换 =====
  let themeMediaQuery = null;
  function applyTheme() {
    const mode = settings?.theme_mode || 'auto';
    let actual = mode;
    if (mode === 'auto') {
      actual = (window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', actual);
    // auto 模式下监听系统变化
    if (mode === 'auto' && !themeMediaQuery) {
      themeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
      themeMediaQuery.addEventListener('change', () => { if (settings?.theme_mode === 'auto') applyTheme(); });
    }
  }

  // ===== 位置模式 =====
  // top（顶部居中，默认）/ top-right（顶部靠右）/ right（右侧竖排），
  // 通过 <html data-position> 钩子交给 CSS 实现布局差异
  function applyPositionMode() {
    const mode = settings?.window_position || 'top';
    document.documentElement.dataset.position = mode;
    try { localStorage.setItem('windowPositionMode', mode); } catch (error) { /* 忽略 */ }
  }

  let lastTickTime = new Date().getTime()
  // 先读取配置，再按启用列表加载插件渲染脚本，最后渲染布局（保证插件组件首次渲染即生效）
  loadScheduleConfig().then(() => loadEnabledPlugins()).then(() => {
    renderComponentLayout()
    applyScheduleCss()
    applyCustomCss()
    applyTheme()
    applyPositionMode()
    scheduleData = getScheduleData();
    tick(true)
    refreshWeather()
  }).catch(() => {
    renderComponentLayout()
    applyScheduleCss()
    applyCustomCss()
    applyTheme()
    applyPositionMode()
    tick(true)
    refreshWeather()
  })
  setInterval(refreshWeather, 10 * 60 * 1000);
  setInterval(() => {
    if (new Date().getTime() - lastTickTime >= 1000) {
      lastTickTime = new Date().getTime()
      tick()
      reportWindowBounds()
    }
  }, 20);

  // ===== 行级淡化 =====
  // 淡化由主进程光标轮询（cursor-position，50ms）驱动：forward 穿透模式下
  // 转发的 mousemove 事件不可靠（有概率长时间收不到），不能依赖。
  // 恢复统一走 300ms 粘性定时器：光标在窗口区域内时轮询心跳会持续重置它，
  // 只有真正离开超过 300ms 才恢复，滑动穿过行间隙/事件流抖动不会闪断。
  const restoreRows = () => {
    componentRows.querySelectorAll('.componentRow.faded').forEach((el) => el.classList.remove('faded'))
  }
  let stickyTimer = null

  // 命中检测：只有光标落在真实组件（[data-component-slot]）上才算命中。
  // 早先按“行矩形（全宽）+ gap 均分”兜底，导致行内空白/组件间隙也算命中，
  // 鼠标移到窗口空白处无法解除淡化；现在空白处明确返回 null（未命中）。
  function findRowAt(x, y) {
    const el = document.elementFromPoint(x, y)
    if (!el || !el.closest) return null
    const component = el.closest('[data-component-slot]')
    if (!component) return null
    return component.closest('.componentRow')
  }

  function fadeRow(row) {
    if (stickyTimer) { clearTimeout(stickyTimer); stickyTimer = null }
    componentRows.querySelectorAll('.componentRow.faded').forEach((f) => {
      if (f !== row) f.classList.remove('faded')
    })
    row.classList.add('faded')
  }

  // delay：离开窗口/失去光标时用 300ms 粘性（避免滑动穿过间隙闪断）；
  // 光标仍在窗口内但没落在组件上时用更短的延迟，快速恢复淡化
  function scheduleRestore(delay = 300) {
    if (stickyTimer) clearTimeout(stickyTimer)
    stickyTimer = setTimeout(() => {
      restoreRows()
      stickyTimer = null
    }, delay)
  }

  function handleCursorAt(x, y) {
    const row = findRowAt(x, y)
    if (row) fadeRow(row)
    else scheduleRestore(120)
  }

  ipcRenderer.on('cursor-position', (e, pos) => {
    if (!pos || !pos.inside) { scheduleRestore(); return }
    handleCursorAt(pos.x, pos.y)
    // 全屏光效窗（透明、screen-saver 层级）显示在主窗口上方时，系统转发的
    // mousemove 会被上层透明窗阻断，主窗口收不到事件就无法把遮罩区域切回
    // 可点击态。遮罩显示期间改用主进程轮询坐标做命中兜底。
    if (reminderMask.classList.contains('active')) {
      const el = document.elementFromPoint(pos.x, pos.y)
      const interactive = !!(el && el.closest && el.closest('.notIgnoreClick'))
      ipcRenderer.send('setIgnore', !interactive)
    }
  })

  // 补充通道：forward 若能转发 pointer/wheel 事件（部分设备/驱动），
  // 直接驱动淡化；wheel 覆盖触控板双指滚动等不移动光标的滑动手势
  window.addEventListener('pointermove', (e) => handleCursorAt(e.clientX, e.clientY))
  window.addEventListener('wheel', (e) => handleCursorAt(e.clientX, e.clientY), { passive: true })

  // 注意：不要监听 document mouseleave 做即时恢复——setIgnore 切换点击
  // 穿透时会产生合成 mouseleave，立刻打掉淡化正是滑动闪烁的根源之一。
  // mousemove 仅用于可交互元素的点击穿透切换
  window.addEventListener("mousemove", event => {
    const className = typeof event.target.className === 'string' ? event.target.className : ''
    ipcRenderer.send('setIgnore', className.indexOf('notIgnoreClick') === -1)
  });
  ipcRenderer.send('setIgnore', true)

  // ===== 窗口尺寸自适应 =====
  // 内容高度 = 组件行区域与课程下方倒计时框（绝对定位、不计入行高）
  // 以及迷你倒计时中视口底部的最大值；行数/字号/布局变化都会触发重测。
  // right 模式还需测量内容宽度：内容是右锚定的，所需窗口宽 =
  // 当前视口宽 - 内容最左缘 + 左边距（缩放后内容左缘稳定落在边距处，不震荡）。
  let lastReportedBounds = { width: 0, height: 0 }

  // right 模式（行变列）下统一各列宽度：先清除约束测出各列自然宽度，
  // 取最大值写入 --right-column-width，所有列等宽、组件在列内居中。
  // 返回值：true = 列宽刚变化，布局尚未稳定；reportWindowBounds 应跳过本次 IPC，
  // 由 ResizeObserver 下一帧自然触发，避免“先窄后宽”的两次跳变。
  function syncRightColumnWidth() {
    if (!componentRows) return false
    if (document.documentElement.dataset.position !== 'right') {
      componentRows.style.removeProperty('--right-column-width')
      return false
    }
    // 先读当前值再清除约束测量自然宽度；目标值相同则恢复原值（帧内无净变化，不触发 RO）
    const current = componentRows.style.getPropertyValue('--right-column-width')
    componentRows.style.removeProperty('--right-column-width')
    let max = 0
    componentRows.querySelectorAll('.componentRow').forEach((row) => {
      const w = row.getBoundingClientRect().width
      if (w > max) max = w
    })
    const target = max > 0 ? Math.ceil(max) + 'px' : ''
    if (target && target !== current) {
      componentRows.style.setProperty('--right-column-width', target)
      return true
    }
    if (current) componentRows.style.setProperty('--right-column-width', current)
    return false
  }

  // 终态内容尺寸测量（与上报口径一致）。
  // right 模式下列宽刚被 syncRightColumnWidth 改写时返回 restylePending，
  // 调用方需等一帧再测；返回的尺寸与视口位置无关（内容包围盒 + 边距），
  // 因此在“新布局 + 旧窗口”的过渡帧里测量也是准确的。
  function measureContentSize(mode) {
    if (!componentRows) return null;
    const rowsRect = componentRows.getBoundingClientRect();
    const miniRect = (miniCountdown && getComputedStyle(miniCountdown).display !== 'none')
      ? miniCountdown.getBoundingClientRect() : null;
    if (mode === 'right') {
      if (syncRightColumnWidth()) return { restylePending: true };
      const edgeMargin = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--top-space')) || 4;
      let contentW = rowsRect.width;
      let contentH = rowsRect.height;
      document.querySelectorAll('.countdownContainer').forEach((el) => {
        const rect = el.getBoundingClientRect();
        if (rect.height <= 0) return;
        const relBottom = rect.bottom - rowsRect.top;
        if (relBottom > contentH) contentH = relBottom;
        // 正在播放 0px 收起动画的悬浮窗：高度随动画逐帧收缩（计入 contentH，
        // 窗口才能跟着收起），但终态是隐藏，残宽不能计入，否则动画结束时
        // 窗口宽度会再跳一次
        if (!countdownHiding.has(el)) {
          const relRight = rect.right - rowsRect.left;
          if (relRight > contentW) contentW = relRight;
        }
      });
      // miniCountdown 是 fixed 居中元素，与内容流无关；显示时其自身尺寸作为下限
      if (miniRect) {
        if (miniRect.height > contentH) contentH = miniRect.height;
        if (miniRect.width > contentW) contentW = miniRect.width;
      }
      return {
        width: Math.ceil(contentW + edgeMargin * 2),
        height: Math.ceil(contentH + edgeMargin * 2),
        restylePending: false
      };
    }
    let bottom = rowsRect.bottom;
    document.querySelectorAll('.countdownContainer').forEach((el) => {
      // 收起动画播放期间也要按实时高度计入：窗口随动画逐帧收缩，
      // 否则第一帧就缩到终态高度，悬浮窗被裁出视口、用户看不到收起动画
      const rect = el.getBoundingClientRect();
      if (rect.height > 0 && rect.bottom > bottom) bottom = rect.bottom;
    });
    if (miniRect && miniRect.bottom > bottom) bottom = miniRect.bottom;
    return { height: Math.ceil(bottom + 2), restylePending: false };
  }

  function reportWindowBounds() {
    if (!componentRows) return;
    if (positionSwitchAnimating) return;
    const mode = settings?.window_position || 'top';
    const size = measureContentSize(mode);
    if (!size) return;
    // 列宽刚统一时布局尚未稳定，下一帧补测
    //（列宽变化会触发 RO，但单列等场景尺寸可能恰好不变，RO 不保证触发）
    if (size.restylePending) {
      requestAnimationFrame(() => reportWindowBounds());
      return;
    }
    if (mode === 'right') {
      if (size.height > 20 && size.width > 40
        && (size.height !== lastReportedBounds.height || size.width !== lastReportedBounds.width)) {
        lastReportedBounds = { width: size.width, height: size.height };
        ipcRenderer.send('main-window-height', { width: size.width, height: size.height });
      }
    } else if (size.height > 20 && size.height !== lastReportedBounds.height) {
      lastReportedBounds = { width: 0, height: size.height };
      ipcRenderer.send('main-window-height', size.height);
    }
  }
  new ResizeObserver(() => reportWindowBounds()).observe(componentRows)

  function setScheduleDialog() {
    ipcRenderer.send('dialog', {
      reply: 'getSelectedClassIndex',
      options: {
        title: '更改课表',
        message: `请选择你要更改的课程序号`,
        buttons: scheduleData.scheduleArray.map((value, index) => { return `第 ${index + 1} 节: ${scheduleConfig.subject_name[value]}` }),
        cancelId: -1,
        defaultId: scheduleData.currentHighlight.index
      }
    })
  }

  ipcRenderer.on('getSelectedClassIndex', (e, arg) => {
    if (arg.index == -1) return
    let text = arg.arg.options.buttons[arg.index]
    let classes = Object.keys(scheduleConfig.subject_name).sort();
    ipcRenderer.send('dialog', {
      reply: 'getSelectedChangingClass',
      index: arg.index,
      classes: classes,
      options: {
        title: '更改课表',
        message: `将 第 ${arg.index + 1} 节 ${scheduleConfig.subject_name[scheduleData.scheduleArray[arg.index]]} 更改为:`,
        buttons: classes.map((value) => { return scheduleConfig.subject_name[value] }),
        cancelId: -1,
      }
    })

  // ===== 位置模式切换动画（先 resize 到终态，再 FLIP） =====
  // 难点：top→right 时窗口矩形本身要从“全宽窄条”变为“贴右竖窗”。
  // 若在旧窗口里直接播放位移动画，竖排内容在 145px 高的旧视口中大面积出界，
  // 动画结束后窗口再收缩又会整体跳一次。因此流程是：
  //   拍旧位置(屏幕坐标) → 切布局 → 测终态尺寸 → 主进程 setBounds 到终态
  //   → 拍新位置(屏幕坐标) → FLIP 各组件/格子独立滑入
  // 切换中间态用 body.position-switching 遮罩，避免“新布局+旧窗口”的出界帧。
  // 动画期间暂停尺寸上报（translate 逐帧污染包围盒测量），结束后补报。
  let positionSwitchAnimating = false
  const nextAnimationFrame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()))

  function screenRectOf(el) {
    const r = el.getBoundingClientRect()
    return {
      left: r.left + window.screenX,
      top: r.top + window.screenY,
      width: r.width,
      height: r.height
    }
  }

  function capturePositionSnapshot() {
    const components = new Map()
    document.querySelectorAll('#componentRows [data-component-slot]').forEach((el) => {
      components.set(el, screenRectOf(el))
    })
    const cells = []
    document.querySelectorAll('.scheduleComponent .classContainer').forEach((container) => {
      cells.push(Array.from(container.children).map((child) => screenRectOf(child)))
    })
    return { components, cells }
  }

  function playPositionFlip(before) {
    if (!before || !componentRows) return
    // 关键：父组件与子格子必须使用完全相同的 duration/easing/delay。
    // 屏幕轨迹 = 父位移 e(t) + 子相对位移 e(t)，只有两者的时间函数相同，
    // 叠加结果才是“旧屏幕位置 → 新屏幕位置”的直线运动。
    // “各组件独立”由各自独立的 Animation 对象承担，而非错开启动时刻。
    const DURATION = 420
    const EASING = 'cubic-bezier(.22,.9,.26,1.08)'
    const run = (el, keyframes) => {
      const anim = el.animate(keyframes, { duration: DURATION, easing: EASING, fill: 'both' })
      anim.onfinish = () => anim.cancel()
    }

    // ===== 第一趟：在创建任何动画之前，先测完全部“to”位置 =====
    // fill:'both' 的动画一创建，首帧偏移立即作用于视觉，此后子元素的
    // getBoundingClientRect 会连带包含父动画偏移，测出的位移会翻倍，
    // 因此测量与动画创建必须分成两趟。
    const componentMoves = []
    const componentDelta = new Map()
    before.components.forEach((from, el) => {
      if (!el.isConnected) return
      const to = screenRectOf(el)
      const dx = from.left - to.left
      const dy = from.top - to.top
      componentDelta.set(el, { dx, dy })
      if (Math.abs(dx) >= 1 || Math.abs(dy) >= 1) {
        componentMoves.push({ el, dx, dy })
      }
    })
    const cellMoves = []
    const containers = document.querySelectorAll('.scheduleComponent .classContainer')
    before.cells.forEach((beforeList, containerIndex) => {
      const container = containers[containerIndex]
      if (!container) return
      const parentSlot = container.closest('[data-component-slot]')
      const parentDelta = (parentSlot && componentDelta.get(parentSlot)) || { dx: 0, dy: 0 }
      Array.from(container.children).forEach((child, i) => {
        const from = beforeList[Math.min(i, beforeList.length - 1)]
        if (!from) return
        const to = screenRectOf(child)
        const dx = from.left - to.left - parentDelta.dx
        const dy = from.top - to.top - parentDelta.dy
        if (Math.abs(dx) >= 1 || Math.abs(dy) >= 1) {
          cellMoves.push({ child, dx, dy })
        }
      })
    })

    // ===== 第二趟：统一创建动画 =====
    componentMoves.forEach(({ el, dx, dy }) => {
      run(el, [
        { translate: `${dx}px ${dy}px` },
        { translate: '0px 0px' }
      ])
    })
    // 课程格子：与父组件同 timing 的独立滑动 + 同步淡入（简称↔全称过渡）。
    // 使用独立 translate 属性（而非 transform），避免与格子自身的
    // enterCurrentClass / enterBreakClass CSS 动画（操作 transform）互相覆盖。
    cellMoves.forEach(({ child, dx, dy }) => {
      run(child, [
        { translate: `${dx}px ${dy}px`, opacity: 0.25 },
        { translate: '0px 0px', opacity: 1 }
      ])
    })
    return DURATION + 80
  }

  ipcRenderer.on('position-mode-changed', async (e, mode) => {
    // 软件设置中选择窗口位置后立即预览（尚未保存到文件）
    if (mode === 'top-right' || mode === 'right' || mode === 'top') {
      settings.window_position = mode
    }
    const nextMode = settings?.window_position || 'top'
    const prevMode = document.documentElement.dataset.position || 'top'
    if (prevMode === nextMode) { applyPositionMode(); reportWindowBounds(); return }

    const before = capturePositionSnapshot()
    // 遮住“新布局 + 旧窗口”的过渡帧（FLIP 动画创建后同帧移除）
    document.body.classList.add('position-switching')
    positionSwitchAnimating = true
    settings.window_position = nextMode
    applyPositionMode()
    // right 模式下课表格子要切换全称/简称与内联倒计时，强制重渲染
    //（tick 有数据对比缓存，数据不变时不会重绘）
    tick(true)
    // 悬浮倒计时框跳过本次 0px 动画、直接落到新布局终态，保证尺寸测量稳定
    finalizeCountdownPopupImmediately()
    try {
      // 等列宽统一（--right-column-width 首次写入会再引发布局变化）与布局收敛
      let size = null
      for (let i = 0; i < 5; i++) {
        await nextAnimationFrame()
        size = measureContentSize(nextMode)
        if (size && !size.restylePending) break
      }
      // 主进程一次性把窗口放到终态矩形（right: 贴右竖窗；top 系列: 全宽横条）
      await ipcRenderer.invoke('apply-position-bounds', size)
      // 等待视口 resize 在渲染端落地后再拍 after
      await nextAnimationFrame()
      await nextAnimationFrame()
      const total = playPositionFlip(before) || 500
      // 动画先创建（fill:both 首帧即把元素锁定在旧位置）再移除遮罩，无中间态绘制
      document.body.classList.remove('position-switching')
      setTimeout(() => {
        positionSwitchAnimating = false
        lastReportedBounds = { width: 0, height: 0 }
        reportWindowBounds()
      }, total)
    } catch (error) {
      console.error('position switch animation failed:', error)
      document.body.classList.remove('position-switching')
      positionSwitchAnimating = false
      reportWindowBounds()
    }
  })

      dayOffset = arg.index

  // ===== 上下课 / 自定义提醒检测 =====
  // 开启/重启/保存设置或课表配置都会整页 reload，内存状态丢失会导致：
  //   · 正在上课时 type 从 null 突变 current → 重发“上课”提醒
  //   · 处于课前倒计时区间 → 重发“即将上课”提醒
  //   · 当前分钟内 → 重发自定义提醒
  // 因此跨 reload 的“已提醒”记录落在 localStorage（按天分键，自然过期）。
  let lastReminderState = { classIndex: null, type: null, fired: {} };
  let firedCustomDate = {};

  const FIRED_STORE_KEY = () => `reminder-fired:${getTodayKey()}`;
  function loadFiredStore() {
    try {
      const raw = localStorage.getItem(FIRED_STORE_KEY());
      if (!raw) return { class: {}, custom: {} };
      const o = JSON.parse(raw);
      return { class: (o && o.class) || {}, custom: (o && o.custom) || {} };
    } catch { return { class: {}, custom: {} }; }
  }
  function saveFiredStore(classKey, customId) {
    try {
      const o = loadFiredStore();
      if (classKey) o.class[classKey] = true;
      if (customId) o.custom[customId] = true;
      localStorage.setItem(FIRED_STORE_KEY(), JSON.stringify(o));
    } catch { /* 存储不可用时退化为仅内存去重 */ }
  }
  function hasFired(classKey, customId) {
    const o = loadFiredStore();
    if (classKey) return !!(o.class[classKey] || lastReminderState.fired[classKey]);
    return !!(o.custom[customId] || firedCustomDate[customId] === getTodayKey());
  }

  function getTodayKey() {
    const d = getCurrentEditedDate();
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }

  function checkReminders(sd) {
    // 总开关：关闭后任何提醒提供方都不触发
    if (settings?.reminder_enabled === false) return;
    const rc = settings?.reminder_class || {};
    const hl = sd.currentHighlight;
    if (!hl) return;
    const dayIdx = getCurrentDayScheduleIndex();
    const sessionKey = (kind, idx) => `${dayIdx}_${idx}_${kind}`;

    // 放学提醒（提醒提供方之一）：当天最后一节课结束后触发一次；按自然日去重
    const rd = settings?.reminder_dismissal || {};
    if (rd.enabled) {
      const dayTimetable = sd.timetable ? scheduleConfig.timetable?.[sd.timetable] : null;
      const dismissalKey = `dismissal_${dayIdx}`;
      if (dayTimetable && isTimetableFinished(dayTimetable, getCurrentTime()) && !hasFired(dismissalKey)) {
        lastReminderState.fired[dismissalKey] = true;
        saveFiredStore(dismissalKey);
        fireReminder({
          text: String(rd.text || '放学了，路上注意安全'),
          duration: Number(rd.duration) || 6000
        });
      }
    }

    // 即将上课：处于课间（isBreak=true 且 type=upcoming）且倒计时 <= N 秒
    if (rc.upcoming_enabled && hl.isBreak && hl.type === 'upcoming' && hl.index !== null) {
      const cd = hl.countdown;
      const secs = Number(rc.upcoming_seconds) || 300;
      const key = sessionKey('upcoming', hl.index);
      if (cd !== null && cd > 0 && cd <= secs && !hasFired(key)) {
        lastReminderState.fired[key] = true;
        saveFiredStore(key);
        fireReminder({ text: rc.upcoming_text || '即将上课', color: 'rgba(0,200,0,0.85)', duration: 5000 });
      }
    }

    // 上课：从非 current 变为 current
    if (rc.start_enabled && hl.type === 'current' && hl.index !== null) {
      const key = sessionKey('start', hl.index);
      if (lastReminderState.type !== 'current' && !hasFired(key)) {
        lastReminderState.fired[key] = true;
        saveFiredStore(key);
        fireReminder({ text: rc.start_text || '上课', color: 'rgba(0,200,0,0.85)', duration: 5000 });
      }
    }

    // 下课：从 current 变为非 current
    if (rc.end_enabled && lastReminderState.type === 'current' && hl.type !== 'current' && lastReminderState.classIndex !== null) {
      const key = sessionKey('end', lastReminderState.classIndex);
      if (!hasFired(key)) {
        lastReminderState.fired[key] = true;
        saveFiredStore(key);
        fireReminder({ text: rc.end_text || '下课', color: 'rgba(200,180,0,0.85)', duration: 5000 });
      }
    }

    lastReminderState.classIndex = hl.index;
    lastReminderState.type = hl.type;

    // 自定义文本提醒
    const nowMin = getCurrentTime().slice(0, 5);
    const today = getTodayKey();
    const customs = settings?.reminder_custom || [];
    if (Array.isArray(customs) && customs.length) {
      // getCurrentTime() 返回 HH:MM:SS，提醒时间是 HH:MM，取前 5 位按分钟比较
      customs.forEach((item) => {
        if (!item || !item.time) return;
        const t = String(item.time).trim().slice(0, 5);
        if (!/^\d{2}:\d{2}$/.test(t)) return;
        const id = item.id || item.time;
        if (hasFired(null, id)) return;
        if (nowMin === t) {
          firedCustomDate[id] = today;
          saveFiredStore(null, id);
          fireReminder({ text: item.text || '提醒', color: item.color || settings?.reminder_color || '', duration: Number(item.duration) || 5000 });
        }
      });
    }

    checkWeatherReminder(nowMin, today);
    checkExtremeWeather();
    checkEarthquakes();
  }

  // ===== 天气提醒：每日固定时间播报；雨/雪/雷/雾等恶劣天气追加提示 =====
  let firedWeatherDate = null;
  function checkWeatherReminder(nowMin, todayKey) {
    const rw = settings?.reminder_weather;
    if (!rw || !rw.enabled) return;
    const t = String(rw.time || '').trim().slice(0, 5);
    if (!/^\d{2}:\d{2}$/.test(t) || nowMin !== t) return;
    if (firedWeatherDate === todayKey || hasFired(null, 'weather')) return; // reload 后当天不重发
    firedWeatherDate = todayKey;
    saveFiredStore(null, 'weather');
    ipcRenderer.invoke('get-weather', rw.city || '').then((data) => {
      if (!data || data.error) return;
      const bad = /[雨雪雷雾凇冻]/.test(data.text || '');
      const head = `${data.city ? data.city + ' ' : ''}${data.temp === null ? '' : data.temp + '° '}${data.text || ''}`.trim();
      fireReminder({
        text: bad ? `${head}，注意天气变化` : head,
        color: settings?.reminder_color || '',
        duration: 6000
      });
    }).catch(() => {});
  }

  // ===== 极端天气提醒：每 10 分钟检测一次当前 WMO 天气码，
  //       命中大雨/冻雨/大雪/强阵雨/雷暴等代码时提醒，同一种天气每天最多一次 =====
  const EXTREME_CODES = new Set([56, 57, 65, 66, 67, 75, 82, 86, 95, 96, 99]);
  const EXTREME_CHECK_INTERVAL = 10 * 60 * 1000;
  let lastExtremeCheckAt = 0;
  let extremeChecking = false;
  function readFiredExtreme() {
    try { return JSON.parse(localStorage.getItem('firedExtremeWeather') || '{}') || {}; }
    catch { return {}; }
  }
  function checkExtremeWeather() {
    const rw = settings?.reminder_weather;
    if (!rw || !rw.extreme_enabled) return;
    const now = Date.now();
    if (extremeChecking || now - lastExtremeCheckAt < EXTREME_CHECK_INTERVAL) return;
    lastExtremeCheckAt = now;
    extremeChecking = true;
    ipcRenderer.invoke('get-weather', rw.city || '').then((data) => {
      if (!data || data.error || data.code === null || data.code === undefined) return;
      // 天气设置 → 排除的气象预警：天气描述命中任一关键词时不提醒
      const excluded = Array.isArray(settings?.weather?.excluded_alerts) ? settings.weather.excluded_alerts : [];
      const weatherText = String(data.text || '');
      if (excluded.some((keyword) => keyword && weatherText.includes(keyword))) return;
      const code = Number(data.code);
      if (!EXTREME_CODES.has(code)) return;
      const todayKey = getTodayKey();
      const fired = readFiredExtreme();
      if (fired.date !== todayKey) { fired.date = todayKey; fired.codes = {}; }
      if (fired.codes[code]) return;
      fired.codes[code] = true;
      try { localStorage.setItem('firedExtremeWeather', JSON.stringify(fired)); } catch { /* 忽略 */ }
      fireReminder({
        text: `极端天气预警：${data.city ? data.city + ' ' : ''}${data.text || '恶劣天气'}，请减少外出、注意安全`,
        color: 'rgba(220,120,0,0.88)',
        duration: 6000
      });
    }).catch(() => {}).finally(() => { extremeChecking = false; });
  }

  // ===== 地震预警：每分钟轮询中国地震台网速报，只报 4.0 级以上、近 30 分钟内
  //       发生且此前未通知过的事件；首次拉取只播种 ID，避免开机即弹窗 =====
  const QUAKE_CHECK_INTERVAL = 60 * 1000;
  const QUAKE_MAG_THRESHOLD = 4.0;
  const QUAKE_FRESH_MS = 30 * 60 * 1000;
  let lastQuakeCheckAt = 0;
  let quakeChecking = false;
  let quakeSeeded = false;
  function readFiredQuakeIds() {
    try {
      const arr = JSON.parse(localStorage.getItem('firedQuakeIds') || '[]');
      return Array.isArray(arr) ? arr : [];
    } catch { return []; }
  }
  function rememberQuakeId(id) {
    try {
      const ids = readFiredQuakeIds().filter((x) => x !== id);
      ids.unshift(id);
      localStorage.setItem('firedQuakeIds', JSON.stringify(ids.slice(0, 60)));
    } catch { /* 忽略 */ }
  }
  function checkEarthquakes() {
    const rw = settings?.reminder_weather;
    if (!rw || !rw.quake_enabled) return;
    const now = Date.now();
    if (quakeChecking || now - lastQuakeCheckAt < QUAKE_CHECK_INTERVAL) return;
    lastQuakeCheckAt = now;
    quakeChecking = true;
    ipcRenderer.invoke('get-earthquakes').then((list) => {
      if (!list || list.error || !Array.isArray(list)) return;
      const firedIds = readFiredQuakeIds();
      list.forEach((ev) => {
        if (ev.magnitude === null || ev.magnitude < QUAKE_MAG_THRESHOLD) return;
        if (!quakeSeeded) {
          // 首次只记录，不提醒（列表含大量历史事件）
          if (!firedIds.includes(ev.id)) rememberQuakeId(ev.id);
          return;
        }
        if (firedIds.includes(ev.id)) return;
        rememberQuakeId(ev.id);
        if (now - ev.epochMs > QUAKE_FRESH_MS) return; // 太旧的事件不再追报
        const source = ev.type === 'reviewed' ? '中国地震台网正式测定' : '中国地震台网自动测定';
        fireReminder({
          text: `地震预警｜${source}：${ev.location}发生${ev.magnitude}级地震，震源深度${ev.depth === null ? '未知' : ev.depth + '千米'}，注意避险`,
          color: 'rgba(220,60,40,0.9)',
          duration: 8000
        });
      });
      quakeSeeded = true;
    }).catch(() => {}).finally(() => { quakeChecking = false; });
  }

  // ===== 统一提醒出口：音效 → 全屏窗口 / 遮罩（+临时置顶） =====
  let reminderAudioCtx = null;
  function playBuiltinChime() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!reminderAudioCtx) reminderAudioCtx = new Ctx();
    const ctx = reminderAudioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    // 两音“叮咚”：A5 → E5，正弦波 + 快速衰减包络

    [{ f: 880, t: 0 }, { f: 659.25, t: 0.28 }].forEach((n) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = n.f;
      gain.gain.setValueAtTime(0, now + n.t);
      gain.gain.linearRampToValueAtTime(0.35, now + n.t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + 0.55);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + n.t);
      osc.stop(now + n.t + 0.6);
    });
  }

  function playReminderSound(adv) {
    if (adv.sound_source === 'custom' && adv.sound_file) {
      try {
        const { pathToFileURL } = require('url');
        const audio = new Audio(pathToFileURL(adv.sound_file).href);
        audio.volume = 0.9;
        audio.play().catch(() => playBuiltinChime());
        return;
      } catch (error) { /* 落到内置提示音 */ }
    }
    playBuiltinChime();
  }

  function fireReminder(payload) {
    const adv = settings?.reminder_advanced || {};
    if (adv.sound_enabled) {
      try { playReminderSound(adv); } catch (error) { /* 静音失败不影响遮罩 */ }
    }
    // 普通提醒：课表条上的遮罩与文字始终显示
    triggerReminderMask(payload);
    // 全屏提醒只是在普通提醒基础上叠加一层全屏渐隐光效（独立窗口、点击穿透）
    if (adv.fullscreen_enabled) {
      // 光效从提醒发出的位置（课表条中心）开始扩散
      const glowPayload = Object.assign({}, payload);
      const originEl = document.querySelector('.scheduleComponent');
      if (originEl) {
        const r = originEl.getBoundingClientRect();
        glowPayload.originX = Math.round(r.left + r.width / 2);
        glowPayload.originY = Math.round(r.top + r.height / 2);
      }
      ipcRenderer.send('reminder-fullscreen', glowPayload);
    }
    if (adv.ontop_enabled) ipcRenderer.send('reminder-pin', { duration: payload.duration });
  }

  // ===== 提醒遮罩 =====
  const reminderMask = document.getElementById('reminderMask');
  const reminderText = document.getElementById('reminderText');
  let reminderHideTimer = null;
  let reminderSyncRaf = 0;
  let lastReminderGeom = '';

  // 上课/下课瞬间课表条会重建（展开格切换、0.45s 入场动画），宽高和位置
  // 都在变。只在触发瞬间测量一次会让遮罩停留在旧几何上（出现明显错位），
  // 因此遮罩显示期间逐帧同步课表条的位置与尺寸。
  function syncReminderMaskGeometry() {
    const scheduleEl = document.querySelector('.scheduleComponent') || globalContainer;
    if (!scheduleEl) return;
    const rect = scheduleEl.getBoundingClientRect();
    const geom = `${rect.left},${rect.top},${rect.width},${rect.height}`;
    if (geom !== lastReminderGeom) {
      lastReminderGeom = geom;
      reminderMask.style.left = `${rect.left}px`;
      reminderMask.style.top = `${rect.top}px`;
      reminderMask.style.width = `${rect.width}px`;
      reminderMask.style.height = `${rect.height}px`;
      reminderMask.style.setProperty('--reminder-x', `${rect.width / 2}px`);
      reminderMask.style.setProperty('--reminder-y', `${rect.height / 2}px`);
      reminderMask.style.setProperty('--reminder-r', `${Math.ceil(Math.hypot(rect.width, rect.height) / 2) + 2}px`);
    }
    if (reminderMask.classList.contains('active')) {
      reminderSyncRaf = requestAnimationFrame(syncReminderMaskGeometry);
    }
  }

  function triggerReminderMask(payload = {}) {
    const text = String(payload.text ?? '').trim();
    reminderText.textContent = text;
    reminderText.style.display = text ? '' : 'none';
    lastReminderGeom = '';
    syncReminderMaskGeometry();
    const color = String(payload.color || settings?.reminder_color || '').trim();
    if (color) reminderMask.style.setProperty('--reminder-bg-color', color);
    else reminderMask.style.removeProperty('--reminder-bg-color');
    clearTimeout(reminderHideTimer);
    reminderMask.classList.remove('closing');
    reminderMask.classList.add('active');
    cancelAnimationFrame(reminderSyncRaf);
    reminderSyncRaf = requestAnimationFrame(syncReminderMaskGeometry);
    void reminderMask.offsetWidth;
    reminderMask.classList.add('shown');
    const duration = Number(payload.duration);
    reminderHideTimer = setTimeout(hideReminderMask, Number.isFinite(duration) && duration > 0 ? duration : 5000);
  }

  function hideReminderMask(manual) {
    clearTimeout(reminderHideTimer);
    reminderHideTimer = null;
    if (!reminderMask.classList.contains('active') || reminderMask.classList.contains('closing')) return;
    // 仅手动关闭（点击/外部隐藏）时通知光效提前淡出；到时自动关闭不打断光效，
    // 保证光效无论提醒时长多短都完整播放 1 秒（由主进程定时隐藏）
    if (manual) ipcRenderer.send('reminder-fullscreen-close');
    reminderMask.classList.add('closing');
    setTimeout(() => {
      reminderMask.classList.remove('active', 'shown', 'closing');
      cancelAnimationFrame(reminderSyncRaf);
      lastReminderGeom = '';
      // 恢复主窗口默认的“空白穿透”态，后续由 forwarded mousemove 重新切换
      ipcRenderer.send('setIgnore', true);
    }, 1100);
  }

  reminderMask.addEventListener('click', () => hideReminderMask(true));

  ipcRenderer.on('reminder-trigger', (e, payload) => {
    if (payload && payload.action === 'hide') {
      hideReminderMask(true);
    } else {
      fireReminder(payload);
    }
  })
</script>

</html>
